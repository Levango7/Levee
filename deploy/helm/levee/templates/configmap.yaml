{{/*
  任意配置：values.config 按 config.example.yaml 的键名原样透传为 config.yaml。
  serve 以 -c /etc/levee/config.yaml 读取；环境变量 LEVEE_* 仍可覆盖。

  内容与 rollout 哈希都取自 include "levee.effectiveConfig"（见 _helpers.tpl）：那里
  只在操作者没写驱动、又要求了 PostgreSQL 时补 database.driver，显式写下的值一律不改。
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "levee.fullname" . }}-config
  labels:
    {{- include "levee.labels" . | nindent 4 }}
data:
  config.yaml: |
    # 由 Helm 从 values.config 渲染；格式见仓库 config.example.yaml。
    # PostgreSQL 的 DSN 刻意不在这里——它在 Secret 里，容器经 LEVEE_DATABASE_DSN 读到。
    {{- $cfg := include "levee.effectiveConfig" . }}
    {{- if trim $cfg }}
    {{- $cfg | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
