{{/*
  认证与主密码 Secret。existingSecret 非空时整块跳过（键约定见 values 注释）。
  - token            : 单令牌模式的令牌
  - named-token-<i>  : 命名令牌，形如 "name=secret"（serve --auth-token）
  - master-password  : 执行引擎凭据面主密码（LEVEE_MASTER_PASSWORD）
*/}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "levee.secretName" . }}
  labels:
    {{- include "levee.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.token }}
  token: {{ .Values.auth.token | quote }}
  {{- end }}
  {{- if .Values.masterPassword }}
  master-password: {{ .Values.masterPassword | quote }}
  {{- end }}
  {{- range $i, $t := .Values.auth.namedTokens }}
  named-token-{{ $i }}: {{ printf "%s=%s" $t.name $t.secret | quote }}
  {{- end }}
{{- end }}
---
{{/*
  PG DSN Secret：集群模式下需要。
  - postgres.externalSecretName 非空 → 由现场自行提供（键：dsn）
  - postgres.dsn 非空               → 本模板创建
  - postgres.enabled=true           → 用内嵌实例的凭据组装 dsn
*/}}
{{- if eq .Values.mode "cluster" }}
{{- if and (not .Values.postgres.externalSecretName) (not .Values.postgres.dsn) .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "levee.pgSecretName" . }}
  labels:
    {{- include "levee.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "levee.pgHost" . }}:5432/{{ .Values.postgres.auth.database }}?sslmode=disable"
{{- else if and (not .Values.postgres.externalSecretName) .Values.postgres.dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "levee.pgSecretName" . }}
  labels:
    {{- include "levee.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.postgres.dsn | quote }}
{{- end }}
{{- end }}
