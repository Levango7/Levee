{{/* single 模式的持久卷：SQLite 数据库 + 审计数据 + 快照目录都在这里 */}}
{{- if and (eq .Values.mode "single") .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "levee.fullname" . }}-data
  labels:
    {{- include "levee.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
