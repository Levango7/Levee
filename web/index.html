<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LEVEE - 非云原生基础设施变更流水线引擎控制台" />
    <title>LEVEE Console</title>
    <script>
      /* Anti-flash bootstrap. The theme is a class on <html> and the stylesheet
       * is bundled, so applying it from the app would paint the first frame
       * light and flip afterwards — which reads as a bug on a dark console.
       * This runs before first paint and does what useTheme does: read the
       * stored choice (default "system"), resolve it, set class + color-scheme.
       *
       * Deliberately tiny and dependency-free, and it necessarily duplicates
       * the storage key and media query from web/src/composables/useTheme.ts
       * (this runs before the module graph loads). useTheme.spec.ts pins both
       * so the two copies cannot drift silently. */
      (function () {
        try {
          var stored = localStorage.getItem('levee-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          } else {
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {
          /* localStorage unavailable: fall through to the light default. */
        }
        try {
          /* Density is applied in the same bootstrap and for the same reason:
           * the compact overrides change panel and row heights, so applying it
           * from the app would paint one frame at the comfortable rhythm and
           * then jump — visible as a reflow on every navigation, and worse on
           * the map, whose scrollbar is computed from the row pitch. Read the
           * stored choice and add the class; "comfortable" is the absence of
           * it. Key and class duplicated from useDensity.ts on purpose (this
           * runs before the module graph); useDensity.spec.ts pins both ends. */
          if (localStorage.getItem('levee-density') === 'compact') {
            document.documentElement.classList.add('density-compact')
          }
        } catch (e) {
          /* localStorage unavailable: fall through to the comfortable default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
