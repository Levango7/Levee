# LEVEE 配置文件
# 默认路径: ~/.levee/config.yaml

# 服务配置
server:
  data_dir: ~/.levee/data          # 数据目录 (SQLite/审计日志)
  log_level: info                   # debug | info | warn | error
  log_format: text                  # text | json

# 数据库：所有 CLI 命令与 serve（未启用 --cluster 时）共用这一处选择，
# 因此「冻结期写给哪个库」由配置文件决定，而不是由先运行了哪条命令决定。
# 口径见 docs/deployment.md 的变更日历一节。
database:
  driver: sqlite                    # sqlite | postgres
  path: ~/.levee/data/levee.db      # sqlite 使用；留空则由 server.data_dir 派生
  # dsn: "postgres://levee:pass@db.internal:5432/levee?sslmode=require"
                                    # postgres 使用；driver: postgres 时必填
  max_open_conns: 50                # 连接池上限（postgres 生效）
  max_idle_conns: 10                # 空闲连接上限（postgres 生效）
  conn_max_lifetime: 30m            # 连接最长存活时间

# 执行配置
executor:
  default_concurrency: 50           # 默认并发数
  max_concurrency: 200              # 最大并发数
  connect_timeout: 10s              # 连接超时
  exec_timeout: 300s                # 执行超时
  rate_limit:
    per_target: 5                   # 单目标机每秒新连接上限
    per_channel: 50                 # 单通道每秒新连接上限
    global: 100                     # 全局每秒新连接上限

# SSH 通道
ssh:
  port: 22
  auth_method: key                  # key | password
  key_path: ~/.ssh/id_rsa
  known_hosts: ~/.ssh/known_hosts
  strict_host_check: true
  connect_timeout: 10s
  pool_size: 10                     # 单目标机连接池大小

# WinRM 通道
winrm:
  port: 5985
  transport: negotiate              # negotiate | kerberos
  connect_timeout: 10s
  pool_size: 5

# 审批配置
approval:
  standard_timeout: 4h              # 标准变更审批超时
  high_timeout: 8h                  # 高危变更审批超时
  emergency_supplement: 24h         # 紧急变更补审时限

# 审计配置
audit:
  hash_chain: true                  # 哈希链
  worm_storage: true                # WORM 存储
  retention_days: 90                # 审计保留天数
  export_format: json               # 导出格式

# 互斥锁
lock:
  ttl: 1h                           # 锁 TTL
  retry_interval: 5s                # 获取锁重试间隔
  max_retry: 10                     # 最大重试次数

# 凭据
credential:
  storage: local                    # local (MVP) | vault (V1)
  encryption: aes256-gcm            # 加密算法
  key_derivation: argon2id          # 密钥派生

# 通知
notify:
  webhook:
    enabled: false
    url: ""
    timeout: 10s
    retry: 3

# 权限
permission:
  default_team: default
  default_env: dev
