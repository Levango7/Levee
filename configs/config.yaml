# LEVEE 配置文件
# 默认路径: ~/.levee/config.yaml

# 服务配置
server:
  data_dir: ~/.levee/data          # 数据目录 (SQLite/审计日志)
  log_level: info                   # debug | info | warn | warning | error（旧别名，log.level 未设置时生效）
  log_format: text                  # text | json（旧别名，log.format 未设置时生效）

# 数据库：所有 CLI 命令与 serve（未启用 --cluster 时）共用这一处选择，
# 因此「冻结期写给哪个库」由配置文件决定，而不是由先运行了哪条命令决定。
# 口径见 docs/deployment.md 的变更日历一节。
database:
  driver: sqlite                    # sqlite | postgres
  path: ~/.levee/data/levee.db      # sqlite 使用；留空则由 server.data_dir 派生
  # dsn: "postgres://levee:pass@db.internal:5432/levee?sslmode=require"
                                    # postgres 使用；driver: postgres 时必填
  max_open_conns: 50                # 连接池上限（postgres 生效）
  max_idle_conns: 10                # 空闲连接上限（postgres 生效）
  conn_max_lifetime: 30m            # 连接最长存活时间

# 执行配置
executor:
  default_concurrency: 50           # 默认并发数
  max_concurrency: 200              # 最大并发数
  connect_timeout: 10s              # 连接超时
  exec_timeout: 300s                # 执行超时
  rate_limit:
    per_target: 5                   # 单目标机每秒新连接上限
    per_channel: 50                 # 单通道每秒新连接上限
    global: 100                     # 全局每秒新连接上限

# 通道配置
channel:
  # SSH 通道
  ssh:
    # SSH 端口。0 = 未设置（用目标自带端口，再回退 22）；非 0 时覆盖目标端口。 默认: 0
    port: 0
    # 认证方式: key | password | key+password | password+key。空 = 按凭据推断。 默认: ""（推断）
    auth_method: ""
    # 私钥路径（当前仅由配置面校验；SSH 认证实际使用解析后凭据的 KeyPath）。默认: ~/.ssh/id_rsa
    key_path: ~/.ssh/id_rsa
    # known_hosts 文件路径（支持 ~）。 默认: ~/.ssh/known_hosts
    known_hosts: ~/.ssh/known_hosts
    # 严格主机密钥校验；生产环境强烈建议保持 true。 默认: true
    strict_host_check: true
    # SSH 连接超时（覆盖 TCP 拨号 + SSH 握手，Go duration）。0 = 通道默认 30s；负数 = 不设超时。 默认: 0（30s）
    connect_timeout: 0s
    # 单目标机 SSH 连接池大小（当前仅校验，通道池仍用自己的默认值）。默认: 10
    pool_size: 10

  # WinRM 通道（当前整段尚未接进传输层，字段只校验不生效，见 D-9）
  winrm:
    # WinRM 端口（1..65535）。 默认: 5985（HTTP）；5986 为 HTTPS
    port: 5985
    # 传输/认证方式: negotiate | ntlm。 默认: negotiate
    transport: negotiate
    # WinRM 连接超时（> 0，Go duration）。 默认: 10s
    connect_timeout: 10s
    # 单目标机 WinRM 连接池大小（> 0）。 默认: 5
    pool_size: 5

# 日志参数（对应 LogConfig）：不写这一段时继承上面的 server.log_level / server.log_format。
# 写了以后 log.* 优先于 server.*。
# log:
#   level: ""                        # debug | info | warn | warning | error；留空 = 继承 server.log_level
#   format: ""                       # text | json；留空 = 继承 server.log_format
#   output: stderr                   # stdout | stderr | <文件路径>（追加写，不做轮转）

# 审批配置
approval:
  standard_timeout: 4h              # 标准变更审批超时
  high_timeout: 8h                  # 高危变更审批超时
  emergency_supplement: 24h         # 紧急变更补审时限

# 审计配置
audit:
  hash_chain: true                  # 哈希链
  worm_storage: true                # WORM 存储
  retention_days: 90                # 审计保留天数
  export_format: json               # 导出格式
  digest_mode: sha256               # 摘要算法: sha256 | sm3（默认 sha256，历史链不受影响）

# 互斥锁
lock:
  ttl: 1h                           # 锁 TTL
  retry_interval: 5s                # 获取锁重试间隔
  max_retry: 10                     # 最大重试次数

# 凭据
credential:
  storage: local                    # local (MVP) | vault (V1)
  encryption: aes256-gcm            # 加密算法
  key_derivation: argon2id          # 密钥派生

# 通知
notify:
  webhook:
    enabled: false
    url: ""
    timeout: 10s
    retry: 3

# 权限
permission:
  default_team: default
  default_env: dev
