# LEVEE workflow example — 跨区域订单库主从切换（场景方案配套示例）
#
# 场景：集团 N 个区域机房，每区若干 MySQL 副本；故障或演练时把副本逐个
# 重指到新主库。本示例演示跨区域数据同步与运维场景的关键形状：
#   * mysql 目标（type: mysql，标签选副本集）与 fleet 下限
#   * batches.strategy = one-per-target：严格每批一台、串行推进
#     （规范为"DB 主库逐个切换"而写——并发切换意味着两个 DDL 窗口）
#   * 维护窗口 in HH:MM 形式（§4.2；跨零点与区域时区见 window.timezone）
#   * 高危审批（两人、排除发起人）
#   * 不可逆动作：mysql.replica_switch 列入 workflow 级 allow_irreversible
#     白名单（V14/LE082 编译期门禁——缺省拒绝一切未列名的不可逆动作），
#     运行时强制 confirm=yes（R2 确认门），计划侧自动标记并路由高危审批；
#     失败不自动回滚（on_failure: manual），由操作员按演练手册决定前滚或人工恢复
#   * 每台切换后用 verify 门禁核对复制状态，再进入下一台
name: dr-switch-orders-db
version: "1.0"
description: >
  把订单库的副本逐个重指到新主库：每批一台、串行、窗口内、高危审批；
  每台切换后核对复制状态（IO/SQL 线程与延迟）才继续。

input:
  - name: new_primary
    type: string
    required: true
    description: 新主库地址（host:port），如 db-primary-b.dc-sh:3306

target:
  name: orders-replicas
  type: mysql
  query: "role=replica AND cluster=orders-db"
  min_count: 1
  max_count: 8

window:
  start: "01:00"
  end: "05:00"
  timezone: Asia/Shanghai

batches:
  strategy: one-per-target

approval:
  level: high
  # high 档要两个互相独立的批准，且发起人不能投（internal/approval/levels.go）。
  # 不声明 approvers 的话，计划期就被"approval under-provisioned"拒掉。
  approvers: [alice, bob]

# V14 白名单：本工作流授权的不可逆动作。未列名的不可逆动作（显式声明或
# 引擎固有能力）会在编译期被 LE082 拒绝——白名单缺席等于什么都没授权。
allow_irreversible:
  - mysql.replica_switch

steps:
  # 复制状态预检：需要引号与管道，走 shell.script 而不是 shell.exec——
  # shell.exec 的命令体受运行期白名单约束（只允许字母数字与 - _ . / = 和
  # 空格，引号与 | 会被拒，见 internal/executor/modules/shell/shell.go），
  # 脚本体不受该白名单限制，由目标机上的 sh 执行。
  - name: precheck-replication
    action: shell.script
    args:
      script: |
        mysql -e "SHOW SLAVE STATUS\G" | grep -E 'Slave_IO_Running|Slave_SQL_Running|Seconds_Behind_Master'

  - name: switch-primary
    action: mysql.replica_switch
    args:
      new_primary: "{{input.new_primary}}"
      confirm: "yes"
    irreversible: true
    depends_on: ["precheck-replication"]
    verify:
      cmd:
        run: "mysql -e \"SHOW SLAVE STATUS\\G\" | grep -c 'Slave_IO_Running: Yes'"
        expect_exit: 0

rollback:
  on_failure: manual
  verify_after: true
