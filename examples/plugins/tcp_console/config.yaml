# Read verbatim at install time (a file named config.yaml next to plugin.yaml)
# and handed to the plugin as the `init` request's config map when a session
# starts. Authentication belongs here, not on the wire: the host never sends
# plaintext credentials to a channel plugin, only a credential reference name.
connect_timeout_ms: 3000
read_timeout_ms: 5000
terminator: "OK"
