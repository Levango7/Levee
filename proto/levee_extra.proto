syntax = "proto3";

package levee;

option go_package = "github.com/nexus/levee/internal/grpc/pb;pb";

// ============================================================================
// AlertService - alert ingestion, status lookup and streaming
// ============================================================================
//
// Added in C5 (task 132). Split out of levee.proto so the extra services can
// be regenerated independently: `protoc --go_out --go-grpc_out` over this
// file produces internal/grpc/pb/levee_extra.pb.go and
// levee_extra_grpc.pb.go (see scripts/gen-proto.sh). The checked-in Go files
// were hand-written while protoc was unavailable in the build environment;
// they are kept as the default build and this generated output is verified
// against them under the `proto_regenerate` build tag.

service AlertService {
  rpc ReceiveAlert(AlertMessage) returns (AlertResponse);
  rpc GetAlertStatus(GetAlertStatusRequest) returns (AlertStatus);
  rpc SubscribeAlerts(SubscribeRequest) returns (stream AlertMessage);
}

// AlertMessage is the wire representation of an alert. Named "AlertMessage"
// to avoid clashing with the alert.Alert domain type when the Go bindings
// are regenerated.
message AlertMessage {
  string id = 1;
  string source = 2;
  // info/warning/critical
  string severity = 3;
  string target = 4;
  string title = 5;
  string description = 6;
  map<string, string> labels = 7;
  string fingerprint = 8;
  // Unix timestamp (seconds since epoch).
  int64 starts_at = 9;
  // Unix timestamp; zero means still firing.
  int64 ends_at = 10;
  // firing/resolved
  string status = 11;
}

message AlertResponse {
  // accepted/duplicate/silenced/invalid/error
  string status = 1;
  string id = 2;
  string reason = 3;
}

message GetAlertStatusRequest {
  string id = 1;
}

message AlertStatus {
  string id = 1;
  string status = 2;
  int64 starts_at = 3;
  int64 ends_at = 4;
  string severity = 5;
}

message SubscribeRequest {
  // Optional severity filter; empty means all severities.
  string severity = 1;
  // Optional source filter; empty means all sources.
  string source = 2;
}

// ============================================================================
// DiagnosisService - on-demand and historical diagnostics
// ============================================================================

service DiagnosisService {
  rpc Diagnose(DiagnoseRequest) returns (DiagnosticReportMessage);
  rpc GetDiagnosis(GetDiagnosisRequest) returns (DiagnosticReportMessage);
}

message DiagnoseRequest {
  // Target host to diagnose.
  string target = 1;
  // Optional alert id that triggered the diagnosis.
  string alert_id = 2;
  // Optional timeout in seconds; zero means use engine default.
  int64 timeout_seconds = 3;
}

message GetDiagnosisRequest {
  string id = 1;
}

// DiagnosticReportMessage is the wire representation of a diagnosis
// report. Named to avoid clashing with diagnosis.DiagnosticReport.
message DiagnosticReportMessage {
  string id = 1;
  string target = 2;
  // manual/alert/scheduled
  string trigger = 3;
  string alert_id = 4;
  // healthy/degraded/unhealthy/unknown
  string status = 5;
  string root_cause = 6;
  double confidence = 7;
  string summary = 8;
  repeated string recommendations = 9;
  repeated string errors = 10;
  int64 started_at = 11;
  int64 duration_ms = 12;
  repeated FindingMessage findings = 13;
}

message FindingMessage {
  string id = 1;
  string category = 2;
  string severity = 3;
  string title = 4;
  string description = 5;
  string evidence = 6;
  string suggestion = 7;
}

// ============================================================================
// ConversationService - multi-turn remediation dialogue
// ============================================================================

service ConversationService {
  rpc SendMessage(SendMessageRequest) returns (ReplyMessage);
  rpc SubscribeConversation(SubscribeRequest) returns (stream ReplyMessage);
}

message SendMessageRequest {
  string session_id = 1;
  string user_id = 2;
  string text = 3;
}

// ReplyMessage is the wire representation of conversation.Reply.
message ReplyMessage {
  string text = 1;
  // Optional action type: approve/reject/execute/modify/cancel/none.
  string action_type = 2;
  // Optional action payload.
  map<string, string> action_payload = 3;
  // Optional session id the reply belongs to.
  string session_id = 4;
}

// ============================================================================
// InventoryService - target groups, bulk import, lifecycle status, history
// ============================================================================
//
// v1.11 asset-management additions. The checked-in Go bindings live in
// internal/grpc/pb/inventory_extra.pb.go and inventory_extra_grpc.pb.go
// (hand-written while protoc was unavailable); field numbers below mirror
// those struct tags exactly.

service InventoryService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ImportTargets(ImportTargetsRequest) returns (ImportTargetsResponse);
  rpc SetTargetStatus(SetTargetStatusRequest) returns (SetTargetStatusResponse);
  rpc TargetHistory(TargetHistoryRequest) returns (TargetHistoryResponse);
}

// Group is a hierarchical inventory group. Names are unique and path-style.
message Group {
  string id = 1;
  string name = 2;
  string parent_id = 3;
}

message CreateGroupRequest {
  string name = 1;
  string parent_id = 2;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {}

// ImportTargetsRequest carries the raw YAML content of an inventory file.
message ImportTargetsRequest {
  string yaml_content = 1;
  // DefaultGroup optionally assigns every imported target lacking an
  // explicit group to this group name (created when missing).
  string default_group = 2;
}

message ImportTargetsResponse {
  int32 created = 1;
  int32 updated = 2;
  int32 failed = 3;
  repeated string errors = 4;
}

message SetTargetStatusRequest {
  string target_id = 1;
  // Status must be one of active|frozen|retired.
  string status = 2;
}

message SetTargetStatusResponse {
  string id = 1;
  string status = 2;
}

// TargetHistoryEntry is one change run that executed on the queried host.
message TargetHistoryEntry {
  string run_id = 1;
  string workflow_name = 2;
  string status = 3;
  string creator = 4;
  int64 created_at = 5;
}

message TargetHistoryRequest {
  // Host is the address (targets.hostname) to look up runs for.
  string host = 1;
  int32 limit = 2;
}

message TargetHistoryResponse {
  repeated TargetHistoryEntry entries = 1;
}
