syntax = "proto3";

package levee;

option go_package = "github.com/nexus/levee/internal/grpc/pb;pb";

// ============================================================================
// AlertService - alert ingestion, status lookup and streaming
// ============================================================================
//
// Added in C5 (task 132); InventoryService (v1.11) was added later. Split
// out of levee.proto so these services can be regenerated independently:
// `scripts/gen-proto.sh` runs protoc over this file to produce
// internal/grpc/pb/levee_extra.pb.go and levee_extra_grpc.pb.go. The CI
// "proto regenerate check" job verifies the checked-in bindings stay
// byte-identical to a fresh regeneration.

service AlertService {
  rpc ReceiveAlert(AlertMessage) returns (AlertResponse);
  rpc GetAlertStatus(GetAlertStatusRequest) returns (AlertStatus);
  rpc SubscribeAlerts(SubscribeRequest) returns (stream AlertMessage);
}

// AlertMessage is the wire representation of an alert. Named "AlertMessage"
// to avoid clashing with the alert.Alert domain type when the Go bindings
// are regenerated.
message AlertMessage {
  string id = 1;
  string source = 2;
  // info/warning/critical
  string severity = 3;
  string target = 4;
  string title = 5;
  string description = 6;
  map<string, string> labels = 7;
  string fingerprint = 8;
  // Unix timestamp (seconds since epoch).
  int64 starts_at = 9;
  // Unix timestamp; zero means still firing.
  int64 ends_at = 10;
  // firing/resolved
  string status = 11;
}

message AlertResponse {
  // accepted/duplicate/silenced/invalid/error
  string status = 1;
  string id = 2;
  string reason = 3;
}

message GetAlertStatusRequest {
  string id = 1;
}

message AlertStatus {
  string id = 1;
  string status = 2;
  int64 starts_at = 3;
  int64 ends_at = 4;
  string severity = 5;
}

message SubscribeRequest {
  // Optional severity filter; empty means all severities.
  string severity = 1;
  // Optional source filter; empty means all sources.
  string source = 2;
}

// ============================================================================
// DiagnosisService - on-demand and historical diagnostics
// ============================================================================

service DiagnosisService {
  rpc Diagnose(DiagnoseRequest) returns (DiagnosticReportMessage);
  rpc GetDiagnosis(GetDiagnosisRequest) returns (DiagnosticReportMessage);
}

message DiagnoseRequest {
  // Target host to diagnose.
  string target = 1;
  // Optional alert id that triggered the diagnosis.
  string alert_id = 2;
  // Optional timeout in seconds; zero means use engine default.
  int64 timeout_seconds = 3;
}

message GetDiagnosisRequest {
  string id = 1;
}

// DiagnosticReportMessage is the wire representation of a diagnosis
// report. Named to avoid clashing with diagnosis.DiagnosticReport.
message DiagnosticReportMessage {
  string id = 1;
  string target = 2;
  // manual/alert/scheduled
  string trigger = 3;
  string alert_id = 4;
  // healthy/degraded/unhealthy/unknown
  string status = 5;
  string root_cause = 6;
  double confidence = 7;
  string summary = 8;
  repeated string recommendations = 9;
  repeated string errors = 10;
  int64 started_at = 11;
  int64 duration_ms = 12;
  repeated FindingMessage findings = 13;
}

message FindingMessage {
  string id = 1;
  string category = 2;
  string severity = 3;
  string title = 4;
  string description = 5;
  string evidence = 6;
  string suggestion = 7;
}

// ============================================================================
// ConversationService - multi-turn remediation dialogue
// ============================================================================

service ConversationService {
  rpc SendMessage(SendMessageRequest) returns (ReplyMessage);
  rpc SubscribeConversation(SubscribeRequest) returns (stream ReplyMessage);
}

message SendMessageRequest {
  string session_id = 1;
  string user_id = 2;
  string text = 3;
}

// ReplyMessage is the wire representation of conversation.Reply.
message ReplyMessage {
  string text = 1;
  // Optional action type: approve/reject/execute/modify/cancel/none.
  string action_type = 2;
  // Optional action payload.
  map<string, string> action_payload = 3;
  // Optional session id the reply belongs to.
  string session_id = 4;
}

// ============================================================================
// InventoryService - target groups, bulk import, lifecycle status, history
// ============================================================================
//
// v1.11 asset-management additions.

service InventoryService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ImportTargets(ImportTargetsRequest) returns (ImportTargetsResponse);
  rpc SetTargetStatus(SetTargetStatusRequest) returns (SetTargetStatusResponse);
  rpc TargetHistory(TargetHistoryRequest) returns (TargetHistoryResponse);
}

// Group is a hierarchical inventory group. Names are unique and path-style.
message Group {
  string id = 1;
  string name = 2;
  string parent_id = 3;
}

message CreateGroupRequest {
  string name = 1;
  string parent_id = 2;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {}

// ImportTargetsRequest carries the raw YAML content of an inventory file.
message ImportTargetsRequest {
  string yaml_content = 1;
  // DefaultGroup optionally assigns every imported target lacking an
  // explicit group to this group name (created when missing).
  string default_group = 2;
}

message ImportTargetsResponse {
  int32 created = 1;
  int32 updated = 2;
  int32 failed = 3;
  repeated string errors = 4;
}

message SetTargetStatusRequest {
  string target_id = 1;
  // Status must be one of active|frozen|retired.
  string status = 2;
}

message SetTargetStatusResponse {
  string id = 1;
  string status = 2;
}

// TargetHistoryEntry is one change run that executed on the queried host.
message TargetHistoryEntry {
  string run_id = 1;
  string workflow_name = 2;
  string status = 3;
  string creator = 4;
  int64 created_at = 5;
}

message TargetHistoryRequest {
  // Host is the address (targets.hostname) to look up runs for.
  string host = 1;
  int32 limit = 2;
}

message TargetHistoryResponse {
  repeated TargetHistoryEntry entries = 1;
}

// ============================================================================
// AgentService - master-side agent registry
// ============================================================================
//
// Why this exists: the agent registry lived only in the memory of whichever
// process constructed it (cmd/levee/cmd_agent_support.go kept an in-process
// singleton), so an agent that registered against the daemon was invisible to
// a CLI process, and `levee agent list` answered with an empty table while
// `agent show` answered not-found. These RPCs read and write the *persisted*
// registry, so the answer no longer depends on which process is asking.
//
// Auth: every method goes through the normal interceptor chain. There is no
// exemption in skipAuthMethods — registration is a write to operator-visible
// state, so it carries an authenticated subject like everything else does.

service AgentService {
  // RegisterAgent creates or refreshes an agent record. Re-registering an
  // existing id updates that record instead of failing, because an agent that
  // restarts should not have to delete its own entry first. The record is
  // stored with status "registered"; its age is measured from the FIRST
  // successful registration, so re-registering does not reset it.
  rpc RegisterAgent(RegisterAgentRequest) returns (AgentRecord);

  // AgentHeartbeat is the liveness write: it advances last_seen and folds in
  // the reported task counters.
  rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatReply);

  // DeregisterAgent is the agent's own goodbye (clean shutdown).
  rpc DeregisterAgent(DeregisterAgentRequest) returns (DeregisterAgentReply);

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsReply);

  rpc GetAgent(GetAgentRequest) returns (AgentRecord);

  // RemoveAgent is the operator-side deletion behind `levee agent remove`.
  // It refuses while the record still reports in-flight tasks unless force
  // is set — deleting a register that is mid-change would erase the only
  // evidence of what is running where.
  rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentReply);
}

// AgentRecord is the wire form of one registry entry.
message AgentRecord {
  string id = 1;
  // address is host:port the agent listens on for task dispatch.
  string address = 2;
  // capabilities are module names the agent can execute (shell, file, pkg...).
  repeated string capabilities = 3;
  // status is one of registered | idle | busy | offline — the vocabulary the
  // registry itself can produce (agent.AgentStatusValues). A fresh registration
  // lands as "registered" until the first heartbeat flips it.
  string status = 4;
  // last_heartbeat_unix is Unix seconds of the most recent heartbeat; 0 until
  // the first one lands.
  int64 last_heartbeat_unix = 5;
  // active_tasks is what the agent last reported as currently executing.
  int32 active_tasks = 6;
  int64 completed_tasks = 7;
  int64 failed_tasks = 8;
  // max_concurrent is the agent's own concurrency ceiling.
  int32 max_concurrent = 9;
  int64 registered_at_unix = 10;
}

message RegisterAgentRequest {
  string id = 1;
  string address = 2;
  repeated string capabilities = 3;
  int32 max_concurrent = 4;
}

message AgentHeartbeatRequest {
  string id = 1;
  // status is OPTIONAL: when empty the server derives idle|busy from
  // active_tasks and max_concurrent with the same rule the in-process
  // registry uses (agent.DeriveStatus). When present it must be one of the
  // accepted agent statuses — an unknown value is rejected rather than
  // stored, so a typo cannot silently make an agent look healthy forever.
  string status = 2;
  int32 active_tasks = 3;
  int64 completed_tasks = 4;
  int64 failed_tasks = 5;
  // client_timestamp_unix is when the agent generated this heartbeat. Zero
  // means "use the server clock".
  int64 client_timestamp_unix = 6;

  // There is deliberately NO max_concurrent here: capabilities, address and
  // the concurrency ceiling are identity/config columns written by
  // RegisterAgent only, while heartbeats write liveness columns only. Two
  // writers for one column is how a "who won" race starts; an agent that
  // changes its own ceiling re-registers (that call is idempotent).
}

message AgentHeartbeatReply {
  string id = 1;
  string status = 2;
  // stale_after_unix is the server-side instant at which this agent is
  // considered offline if no further heartbeat arrives.
  int64 stale_after_unix = 3;
}

message DeregisterAgentRequest {
  string id = 1;
}

message DeregisterAgentReply {
  bool removed = 1;
}

message ListAgentsRequest {
  // capability optionally filters to agents advertising it.
  string capability = 1;
  // status optionally filters on an exact AgentRecord.status match. It is
  // validated against the registry vocabulary rather than passed through:
  // an unknown filter value must not look like "no agents registered".
  string status = 2;
}

message ListAgentsReply {
  repeated AgentRecord agents = 1;
}

message GetAgentRequest {
  string id = 1;
}

message RemoveAgentRequest {
  string id = 1;
  // force removes the record even when it still reports in-flight tasks.
  bool force = 2;
}

message RemoveAgentReply {
  bool removed = 1;
  // refusal explains why nothing was removed (empty when removed is true).
  // It is a field rather than a status message so the CLI can print something
  // actionable without decoding error strings.
  string refusal = 2;
}
