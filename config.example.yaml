# =============================================================================
# LEVEE 配置示例（config.example.yaml）
# =============================================================================
#
# 使用方法：
#   复制本文件为 config.yaml 并按需修改：
#     cp config.example.yaml config.yaml
#
# 配置文件查找顺序（来自 cmd/levee 的 -c/--config 旗标与 CLI 默认约定）：
#   1. --config / -c 显式指定的路径（必须存在，否则启动失败）
#   2. 默认位置 ~/.levee/config.yaml
#   （未找到任何配置文件时，全部使用内置默认值 + 环境变量。）
#
# 单个配置键的生效优先级（见 internal/config/config.go）：
#   环境变量 LEVEE_<SECTION>_<KEY>（最高）> 配置文件值 > 内置默认值（最低）
#   例：LEVEE_DATABASE_PATH=/var/levee/levee.db 覆盖 database.path
#        LEVEE_LOG_LEVEL=debug                   覆盖 log.level
#
# 说明：
#   - 所有时间值使用 Go duration 语法：500ms / 10s / 5m / 4h / 24h
#   - 路径支持 ~ 前缀展开（如 ~/.ssh/id_rsa）
#   - 敏感值一律使用占位符（<...>），切勿将真实密钥提交到版本库
#   - gRPC 服务的 --addr / --tls-cert / --tls-key / --token 是 `levee serve`
#     的命令行旗标（token 亦可经 LEVEE_TOKEN 环境变量注入），不属于本文件
#   - 凭据主密码通过 LEVEE_MASTER_PASSWORD 环境变量在运行时注入，不落盘
#
# 本文件与 internal/config/config.go 的结构体/mapstructure tag 一一对应。
# =============================================================================

# -----------------------------------------------------------------------------
# server —— 服务运行参数（对应 ServerConfig）
# -----------------------------------------------------------------------------
server:
  # 数据目录（SQLite 数据库、审计日志等落盘位置）。必填。 默认: ~/.levee/data
  data_dir: ~/.levee/data
  # 日志级别: debug | info | warn | error。 默认: info
  log_level: info
  # 日志格式: text | json。 默认: text
  log_format: text

# -----------------------------------------------------------------------------
# database —— 数据库配置（对应 DatabaseConfig）
# 所有命令与 serve（未加 --cluster 时）都只按这里的 driver/path/dsn 取库，一处生效。
# 因此「冻结期写在哪个库」由配置文件决定，而不是由先运行了哪条命令决定；
# 集群/服务端共享库形态请用 driver: postgres 并把 dsn 指向服务端那个库
# （见 docs/deployment.md 的变更日历一节，含 --pg-dsn 与 database.dsn 必须一致这条约束）。
# -----------------------------------------------------------------------------
database:
  # 数据库驱动。其他取值是配置错误，程序不会退回 sqlite。 默认: sqlite
  driver: sqlite    # sqlite | postgres
  # 数据库文件路径（绝对/相对路径，支持 ~），仅 sqlite 使用。
  # 留空时自动派生为 <server.data_dir>/levee.db。
  path: ""    # 例: ~/.levee/data/levee.db
  # PostgreSQL 连接串，仅 postgres 使用且此时必填；sqlite 配了 dsn 会启动失败。
  # 该值含凭据，因此不会原样出现在任何输出面上（打印形态为 postgres@host:port/db）。
  # 环境变量覆盖名：LEVEE_DATABASE_DSN。
  dsn: ""    # 例: postgres://levee:pass@db.internal:5432/levee?sslmode=require
  # 连接池：最大打开连接数（>= 0）。 默认: 50
  max_open_conns: 50
  # 连接池：最大空闲连接数（>= 0，且 <= max_open_conns）。 默认: 10
  max_idle_conns: 10
  # 连接池：连接最大存活时间（Go duration）。 默认: 30m
  conn_max_lifetime: 30m

# -----------------------------------------------------------------------------
# log —— 日志参数（对应 LogConfig）
# level/format 未显式设置时自动镜像 server.log_level / server.log_format。
# -----------------------------------------------------------------------------
log:
  # 日志级别: debug | info | warn | error。 默认: 继承 server.log_level
  level: info
  # 日志格式: text | json。 默认: 继承 server.log_format
  format: text
  # 日志输出: stdout | stderr | <文件路径>。 默认: stderr
  output: stderr

# -----------------------------------------------------------------------------
# executor —— L2 编排层调优（对应 ExecutorConfig）
# -----------------------------------------------------------------------------
executor:
  # 单 run 默认并发数（> 0，且 <= max_concurrency）。 默认: 50
  default_concurrency: 50
  # 允许的最大并发数（> 0）。 默认: 200
  max_concurrency: 200
  # 目标机连接超时（> 0，Go duration）。 默认: 10s
  connect_timeout: 10s
  # 单步执行超时（> 0，Go duration）。 默认: 300s
  exec_timeout: 300s
  # 限速：三个粒度上限制每秒新建连接数（均 > 0）
  rate_limit:
    # 单目标机每秒新连接上限。 默认: 5
    per_target: 5
    # 单通道每秒新连接上限。 默认: 50
    per_channel: 50
    # 全局每秒新连接上限。 默认: 100
    global: 100

# -----------------------------------------------------------------------------
# channel —— 通道实现配置（对应 ChannelConfig）
# 当前一等公民为 SSH 与 WinRM；Agent / API / Interactive 为后续版本规划。
# -----------------------------------------------------------------------------
channel:
  # SSH 通道（对应 SSHConfig）
  ssh:
    # SSH 端口（1..65535）。 默认: 22
    port: 22
    # 认证方式: key | password。 默认: key
    auth_method: key
    # 私钥路径（auth_method=key 时必填，支持 ~）。 默认: ~/.ssh/id_rsa
    key_path: ~/.ssh/id_rsa
    # known_hosts 文件路径（支持 ~）。 默认: ~/.ssh/known_hosts
    known_hosts: ~/.ssh/known_hosts
    # 严格主机密钥校验；生产环境强烈建议保持 true。 默认: true
    strict_host_check: true
    # SSH 连接超时（> 0，Go duration）。 默认: 10s
    connect_timeout: 10s
    # 单目标机 SSH 连接池大小（> 0）。 默认: 10
    pool_size: 10
    # 提权方式: "" (禁用，默认) | sudo。其他取值在 Exec 时 fail-closed。
    # sudo 提权要求目标机已配置免密（NOPASSWD）sudo。 默认: ""
    become_method: ""
    # 提权目标用户（become_method=sudo 时生效）；空表示 root。 默认: ""
    become_user: ""

  # WinRM 通道（对应 WinRMConfig）
  winrm:
    # WinRM 端口（1..65535）。 默认: 5985（HTTP）；5986 为 HTTPS
    port: 5985
    # 传输/认证方式: negotiate | kerberos。 默认: negotiate
    transport: negotiate
    # WinRM 连接超时（> 0，Go duration）。 默认: 10s
    connect_timeout: 10s
    # 单目标机 WinRM 连接池大小（> 0）。 默认: 5
    pool_size: 5

# -----------------------------------------------------------------------------
# approval —— 三级审批超时（对应 ApprovalConfig，均 > 0）
# -----------------------------------------------------------------------------
approval:
  # 标准变更审批超时。 默认: 4h
  standard_timeout: 4h
  # 高危变更审批超时。 默认: 8h
  high_timeout: 8h
  # 紧急变更（--force）补审时限。 默认: 24h
  emergency_supplement: 24h

# -----------------------------------------------------------------------------
# audit —— 防篡改审计子系统（对应 AuditConfig）
# -----------------------------------------------------------------------------
audit:
  # 启用哈希链（tamper-evident）。 默认: true
  hash_chain: true
  # 启用 WORM（Write-Once-Read-Many）存储。 默认: true
  worm_storage: true
  # 审计记录保留天数（> 0）。 默认: 90
  retention_days: 90
  # 审计导出格式: json | csv。 默认: json
  export_format: json

# -----------------------------------------------------------------------------
# lock —— 目标级互斥的分布式锁调优（对应 LockConfig）
# -----------------------------------------------------------------------------
lock:
  # 锁 TTL（> 0，Go duration）。 默认: 1h
  ttl: 1h
  # 获取锁的重试间隔（> 0，Go duration）。 默认: 5s
  retry_interval: 5s
  # 最大重试次数（>= 0）。 默认: 10
  max_retry: 10

# -----------------------------------------------------------------------------
# credential —— 凭据存储与加密参数（对应 CredentialConfig）
# 注意：主密码不在本文件中配置，运行时通过 LEVEE_MASTER_PASSWORD 环境变量
#       注入，绝不落盘；加密后的凭据由 `levee secret` 管理。
# -----------------------------------------------------------------------------
credential:
  # 凭据存储后端: local (MVP) | vault (V1)。 默认: local
  storage: local
  # 加密算法（必填）。 默认: aes256-gcm
  encryption: aes256-gcm
  # 密钥派生算法（必填）。 默认: argon2id
  key_derivation: argon2id

# -----------------------------------------------------------------------------
# notify —— 出站通知与镜像（对应 NotifyConfig）：通用 webhook、ITSM Jira 审批镜像、
# ChatOps 审批镜像（Slack / 钉钉 / 飞书 webhook bot）
# -----------------------------------------------------------------------------
notify:
  webhook:
    # 是否启用 webhook 通知。 默认: false
    enabled: false
    # webhook 接收地址（enabled=true 时必填）。使用占位符，勿写真密钥
    url: ""                       # 例: https://hooks.example.com/levee/<your-token>
    # 请求超时（enabled=true 时必须 > 0，Go duration）。 默认: 10s
    timeout: 10s
    # 失败重试次数（>= 0）。 默认: 3
    retry: 3
    # 签名密钥走环境变量 LEVEE_WEBHOOK_SECRET（HMAC-SHA256，随
    # X-Levee-Signature: sha256=… 一起发出）。不设则明文投递：接收端无法
    # 验真，启动日志会说明这一点。当前该渠道的投递源只有回滚分级。

  # jira —— 出站 ITSM 审批镜像：审批启动建 issue、决策自动评论。
  # 默认关闭（零外发）；启用时 url / project_key / api_token 必填，
  # 缺失会拒绝启动并指名缺哪个键。
  jira:
    enabled: false
    url: ""                       # 例: https://jira.example.com
    project_key: ""               # 例: OPS
    api_token: "<jira-api-token>" # 亦可经 LEVEE_NOTIFY_JIRA_API_TOKEN 注入
    email: ""                     # Jira Cloud 用邮箱作为 basic auth 用户
    issue_type: "Task"            # 默认: Task
    timeout: 10s

  # chatops —— ChatOps 审批镜像：审批创建/决策事件投影到聊天群 webhook bot。
  # 默认关闭（零装配）；启用时至少一个 bot，且每个 bot 的 name 与 webhook_url
  # 必填（缺失会拒绝启动并指名 bot）。观察者槽位是扇出，与 jira 镜像并存不互斥。
  chatops:
    enabled: false
    bots: []                      # 例（三平台各一）：
    # - platform: slack           # slack | dingtalk | feishu
    #   name: ops-alerts
    #   webhook_url: "<slack-incoming-webhook-url>"
    #   timeout: 10s
    # - platform: dingtalk
    #   name: dingtalk-approvals
    #   webhook_url: "<dingtalk-robot-webhook-url>"
    #   secret: "<signing-secret>"  # 钉钉加签密钥（可选）
    # - platform: feishu
    #   name: feishu-approvals
    #   webhook_url: "<feishu-bot-webhook-url>"

# -----------------------------------------------------------------------------
# permission —— 权限命名空间默认值（对应 PermissionConfig）
# -----------------------------------------------------------------------------
permission:
  # 默认团队（必填）。 默认: default
  default_team: default
  # 默认环境（必填）。 默认: dev
  default_env: dev
  # bulk_grants —— 批量暂停/恢复（pause-all / resume-all）的授权名单：
  # **已验签主体** → 已授予的权限名。键匹配的是命名令牌名 / SSO / OIDC 主体，
  # 不是客户端自报的 `x-actor`——后者在共享单令牌模式下谁都能宣称，用它做判定
  # 等于把锁的钥匙挂在门上。因此只配了 `--token <secret>` 的部署调用这两个 RPC
  # 会拿到 Unauthenticated（与提交审批同样的迁移要求：用 --auth-token name=secret
  # 或 SSO/OIDC）。权限名与 `levee pause all` 遵守的是同一套（pause:all /
  # resume:all），配好的名单在 CLI 与 API 两条路径上生效一致。被拒的调用会写入
  # 审计（action=permission.denied）。
  #
  # 留空（默认）＝ **不拦**：批量暂停是事故处置手段，不能因为没人写过这份
  # 名单就在最需要它的时候失效；作为交换，`serve` 启动时会 WARN 明示
  # "authorization is NOT configured"，让缺口可见而不是静默。
  #
  # 现状订正（此前这段写着"serve 从不加载 permissions.yaml / users.yaml /
  # roles.yaml"，那已不成立）：`serve` 会加载这三份文件并把矩阵与角色树合成
  # 一个判定（矩阵管"这个队能在哪些环境活动"，角色树管"在这些环境里能做什么"，
  # 显式撤销优先于一切）。生效范围 = 治理动作 plan / apply / rollback / approve /
  # reject + 变更读路径 view + **清单/模板库/审计面/系统面**（写= admin，
  # 读= view，列表按可见环境收窄；无 env 概念的资源按 permission.default_env
  # 判定，未配 default_env 即拒绝）+ pause_all / resume_all 这两个批量动作。
  # 文件解析失败则**启动失败**
  # ——把坏策略静默降级成"不拦"比没有策略更危险。**条件式 ABAC 已接线**：本目录下若有
  # policies.yaml，serve 会读它，并在矩阵×角色放行后再跑一道"只收窄"的策略层（变更类
  # 动作映射到 change:*；条件里可用 env / target.env；无策略匹配=维持原判定，求值出错=
  # 拒绝）。细节见 CHANGELOG 与 internal/authz/authz.go 的 applyPolicyLayer。
  # 读路径的缺省姿态（刻意与写不同）：没有可验签主体的调用者**不被过滤**，因为
  # 共享令牌下所有调用者是同一个主体，拒他们不会带来任何隔离、只会让看板变黑；
  # 需要按队隔离读可见性就启用命名令牌 / SSO / OIDC。
  bulk_grants: {}
  #  bulk_grants:
  #    alice: ["pause:all", "resume:all"]
  #    sre-oncall: ["pause:all"]        # 只给刹车，不给重启
  # ⚠ 权限矩阵文件（teams × environments × actions，见 cmd_user 加载的
  # matrix YAML）风险须知：给某团队授予 `admin` 且环境为通配 `*` 意味着
  # 该团队对当前与未来所有环境全权（admin 超集规则）。这是 LEVEE 启动/加载
  # 时会 WARN（列出涉及团队）的配置，生产矩阵应逐环境显式授权；矩阵中出现
  # AllActions 之外的 action 名同样会 WARN（拼错的 action 静默失效，
  # 既授不了权也挡不住人）。

# -----------------------------------------------------------------------------
# verify —— 未来验证 / SLO 门禁（对应 VerifyConfig）
# -----------------------------------------------------------------------------
verify:
  # Prometheus 基础地址，供未来 SLO 门禁查询。
  # 留空则禁用这些门禁（MVP 默认）。 默认: ""
  prometheus_url: ""              # 例: http://prometheus.monitoring.svc:9090

# -----------------------------------------------------------------------------
# inventory —— 资产清单子系统（对应 InventoryConfig）
# -----------------------------------------------------------------------------
inventory:
  # 对清单内目标做可达性巡检的周期（秒）。0 表示禁用巡检。 默认: 0
  patrol_interval_seconds: 0

# -----------------------------------------------------------------------------
# auth —— API 认证（静态令牌由 --token / --auth-token / LEVEE_TOKEN 提供，
# 此处只承载 OIDC；对应 AuthConfig）
# -----------------------------------------------------------------------------
auth:
  oidc:
    # 启用 OIDC JWT 验证。开启后，形如 JWT（三段式）的 Bearer 令牌会先尝试
    # 静态令牌比对、再走 IdP 验证；静态令牌不受影响。 默认: false
    enabled: false
    # IdP 的 issuer 地址，发现文档读取自
    # <issuer_url>/.well-known/openid-configuration。serve 启动时即拉取，
    # 失败直接拒绝启动（fail-fast）。 例: https://idp.example.com/realms/levee
    issuer_url: ""
    # LEVEE 在 IdP 注册的 client_id（同时作为期望的 aud，除非另配 audience）
    client_id: ""
    # 期望的 aud 声明。留空使用 client_id；IdP 为 API 单独签发 audience 时才需配置
    audience: ""
    # 作为审计主体（subject）的用户声明。 默认: preferred_username
    username_claim: preferred_username
    # 携带角色的声明名。留空表示不提取角色。 默认: ""
    role_claim: ""
    # 携带租户的声明名，值取自**已验签**的 token。 多租户部署且以 OIDC
    # 为身份来源时必须配置：未配置则解析不出租户，请求会被拒绝
    # （fail-closed），而不是回落到 default 租户。 默认: ""
    tenant_claim: ""
    # IdP 角色 -> LEVEE 角色映射；未命中的角色原样保留。仅文件可配
    # （环境变量无法表达嵌套映射）。 默认: {}
    role_map: {}

  # GitHub OAuth 登录（GitHub 非 OIDC 提供方：令牌不透明、token 端点无
  # 浏览器 CORS，因此 code 交换在服务端完成，由网关签发 LEVEE 本地会话
  # 令牌，后续请求走本地 HMAC 校验、不访问 api.github.com）
  github:
    # 启用 GitHub 登录。开启后登录页出现"通过 GitHub 登录"按钮。 默认: false
    enabled: false
    # GitHub OAuth App 的 client_id / client_secret
    # （GitHub -> Settings -> Developer settings -> OAuth Apps 注册，
    # 回调地址填 <你的站点>/login/callback）
    client_id: ""
    client_secret: ""
    # 限制仅该 GitHub 组织成员可登录。留空 = 任何 GitHub 用户完成授权即可
    # 登录（内部部署务必设置！）。 默认: ""
    org: ""
    # GitHub 团队 -> LEVEE 角色映射，键为 "org/team-slug"；未列出的团队
    # 不产生角色。仅文件可配。 默认: {}
    team_role_map: {}              # 例: { "acme/admins": admin, "acme/devs": operator }
    # LEVEE 会话令牌的 HMAC 密钥（SSO 登录产物）。留空 = 进程内随机密钥
    # （重启后所有会话失效，多节点/负载均衡部署必须配置共享密钥）。
    # 至少 32 字符。 默认: ""
    session_secret: ""             # 例: openssl rand -hex 32 的输出

# =============================================================================
# ai —— AI 辅助（对应 AIConfig）
# =============================================================================
# llm —— 推荐引擎的混合模式（对应 AIConfig.LLMConfig）。
# 默认关闭：不构造客户端，推荐引擎走纯知识库路径（与引入本节之前逐字节一致）。
# 开启后诊断/会话的修复建议由 LLM 与知识库证据合并产出（recommend 引擎的
# hybrid 模式）；客户端构造失败会降级回知识库模式并打 warn 日志，守护进程
# 照常启动（与 tracing 的降级契约相同）。
ai:
  llm:
    # 开关。 默认: false
    enabled: false
    # provider: openai | ollama（"mock" 仅供测试）。 默认: openai
    provider: openai
    # API key。留空 = 回落到 OPENAI_API_KEY 环境变量。 默认: ""
    api_key: "<openai-api-key>"
    # 模型名。 默认: ""
    model: "<gpt-4o / llama3 等>"
    # 自定义端点；留空 = provider 默认值。 默认: ""
    base_url: ""
    # 补全上限 token 数（0 = 内置默认）。 默认: 0
    max_tokens: 0
    # 采样温度 0-1（0 = 内置默认）。 默认: 0
    temperature: 0
    # 单次请求超时。 默认: 30s
    timeout: 30s

# =============================================================================
# tenant —— 多租户隔离
# =============================================================================
# 默认关闭，且这个默认值是有意为之：关闭时网关完全不做租户解析，所有行归属
# 单一 default 租户，现有的单租户部署行为**逐字节不变**。
#
# 租户来自**凭据本身**，不是请求头：命名令牌用
# `--auth-token name=secret,tenant`，OIDC 用上面的 auth.oidc.tenant_claim。
# 客户端无法通过改请求内容切换自己所属的租户。
#
# 开启后的语义是 fail-closed：上下文中没有租户的请求会被**拒绝**，而不是
# 回落到 default。这一条是整个设计的核心——若允许回落，任何漏了传播的调用点
# （新 RPC、后台 goroutine、将来的重构）都会静默读写 default 租户的数据，
# 那正是"以为在隔离、实际有洞"的失败模式。启动时若没有任何凭据绑定租户，
# serve 直接拒绝启动并说明该配什么。
#
# 覆盖面：runs / batches / steps / trace / approvals / audit / credentials /
# inventory_groups / targets / run_assignment 共 10 张表。
# 刻意**不**覆盖 locks：锁保护的是一台物理主机，按租户分锁会让两个租户同时
# 拿到同一台主机，正是锁要防的并发变更冲突。
tenant:
  # 默认: false
  enabled: false

# =============================================================================
# diagnosis —— 诊断管线扩展（对应 DiagnosisConfig）
# =============================================================================
# topology —— 诊断的"影响半径"阶段：从 APM / OpsMesh 拉取服务调用图，对目标
# 所在服务分析上下游依赖与不健康边（APM 源还有错误率；OpsMesh 目录图带节点
# status），作为 Findings 进入诊断报告。provider 留空（默认）关闭本阶段；
# skywalking/pinpoint 需要 endpoint，opsmesh 走平台目录图（需 opsmesh.enabled +
# base_url）；配缺了或不认识的 provider 都打 warn 降级（诊断不能因为可选证据源
# 缺失而停摆）。
diagnosis:
  topology:
    # 后端: skywalking | pinpoint | opsmesh。 默认: ""（关闭）
    provider: ""
    # APM API 基址（opsmesh 忽略此项，用 opsmesh.base_url）。 例: http://skywalking:12800
    endpoint: ""
    # opsmesh 的租户范围（空 = 平台默认租户）。 默认: ""
    tenant_id: ""
    # 采集 HTTP 超时。 默认: 10s
    timeout: 10s

# =============================================================================
# opsmesh —— OpsMesh 平台集成（对应 OpsMeshConfig，见 docs/opsmesh-integration-design.md）
# =============================================================================
# 默认关闭；启用时 base_url 必填（缺失拒绝启动）。
# 两个方向都已接线（2026-10-03，按平台源码核实的真实契约）：
#  - 结果回传：POST /api/v1/alerts/{id}/resolution（设计 §6.2）。**平台现状**：
#    只实现了 {id}/ack 与 {id}/silence，尚无 resolution 端点——对着这样的部署
#    上报会得到 404（记 warn、非致命）；改用 ack 的方案被否决：ack 不带结果载荷
#    且会压制平台自身的升级语义，自动化静默确认告警属于平台侧策略，不由本仓单方面决定。
#  - 拉取：GET /api/v1/catalog/topology?tenantID=（目录图，节点带 status/metadata）
#    与 POST /api/v1/prometheus/query（PromQL 透传）。诊断影响半径阶段可配
#    provider: opsmesh；操作员也可直接用 `levee opsmesh topology|metrics` 查询。
# api_key 需是平台侧有效的凭据（devicesvc 网关对其端点有租户鉴权中间件）。
opsmesh:
  enabled: false
  base_url: ""                    # 例: https://opsmesh.example.com
  api_key: "<opsmesh-api-key>"
  timeout: 30s

# =============================================================================
# security —— 安全加固开关
# =============================================================================
security:
  # 追加自定义敏感字段名，合并进审计脱敏内置词表（password/passwd/key/token/
  # secret/credential/private_key/api_key/passphrase/auth_code/refresh_token/
  # access_token/ssh_key/cert/certificate/connection_string）。
  # 匹配规则与内置一致：大小写不敏感，精确命中或 `_`/`-` 词边界后缀命中
  # （license_plate 命中 licenseplate，sortkey 不命中）。不校验字段是否真实
  # 存在，写错只是空转。仅文件可配（环境变量无法表达列表）。 默认: []
  sensitive_fields: []             # 例: [ "license_plate", "vault_uri" ]

  # 是否允许 `SystemService.GetConfig` 返回**未脱敏**配置（含目标机凭据、token）。
  # 默认 false = 一律脱敏，任何请求字段都无法解除。之所以由部署决定而不是由
  # 请求决定：wire 上的 `redact_secrets` 是 proto3 标量 bool，"没设置"与"设为
  # false"在服务器端不可区分，"按请求决定"就意味着裸调用拿明文（这正是此前
  # 的行为，注释却写着默认脱敏）。
  # 打开后：调用方省略该字段或显式传 false 会拿到明文，每次如此响应都记 WARN，
  # `levee system config` / REST 的 `?redactSecrets=false` 也走同一开关。
  # 可用 LEVEE_SECURITY_EXPOSE_RAW_CONFIG=true 覆盖，便于容器化部署不改文件。
  # 默认: false
  expose_raw_config: false

# =============================================================================
# state —— 状态库（SQLite）行为开关
# =============================================================================
state:
  # SQLite synchronous 模式（SA-019）：normal = WAL 下按检查点批量 fsync
  # （默认，维持既有吞吐）；full = 每次提交都 fsync，审计强持久场景使用
  # （掉电不丢已提交事务，代价约 1-2% 写放大）。 默认: normal
  sqlite_synchronous: normal

# =============================================================================
# 场景示例（按需取消注释并合并到上方正式段落）
# =============================================================================
#
# -----------------------------------------------------------------------------
# 场景一：最小单机（开箱即用，全部使用默认值）
# -----------------------------------------------------------------------------
# server:
#   data_dir: ~/.levee/data
# 其余键全部省略，使用内置默认值：
#   SQLite 库自动落在 ~/.levee/data/levee.db，SSH key 认证，
#   并发 50/200，审计哈希链 + WORM 开启。
#
# -----------------------------------------------------------------------------
# 场景二：多节点集群
# -----------------------------------------------------------------------------
# 注意：集群形态的服务端由 `levee serve --cluster --pg-dsn <dsn>` 指定 PostgreSQL，
#       该 DSN 必须与这里 `database.dsn` 一致（两处同时存在且不同 → 启动失败）；
#       运维侧要用 CLI 读写同一个库（尤其是 `levee calendar` 的冻结期），就把
#       本文件的 driver 设为 postgres、dsn 设为服务端那个库，否则命令只会作用在
#       操作者本机的 SQLite 文件上（`calendar create --frozen` 会在 stderr 说明
#       这一行落在哪个库）。各节点仍应使用独立 data_dir，勿放网络共享盘。
# server:
#   data_dir: /var/lib/levee/data
#   log_level: info
#   log_format: json
# database:
#   driver: postgres
#   dsn: postgres://levee:pass@db.internal:5432/levee?sslmode=require
#   max_open_conns: 100
#   max_idle_conns: 20
# executor:
#   default_concurrency: 100
#   max_concurrency: 400
#   rate_limit:
#     per_target: 10
#     per_channel: 100
#     global: 200
# inventory:
#   patrol_interval_seconds: 300
# notify:
#   webhook:
#     enabled: true
#     url: https://hooks.example.com/levee/<your-token>
#     timeout: 10s
#     retry: 3
#
# -----------------------------------------------------------------------------
# 场景三：生产加固（开启全部安全开关）
# -----------------------------------------------------------------------------
# server:
#   log_level: warn
#   log_format: json
# channel:
#   ssh:
#     auth_method: key
#     key_path: /etc/levee/secrets/id_ed25519
#     known_hosts: /etc/levee/known_hosts
#     strict_host_check: true      # 保持严格主机密钥校验
#     pool_size: 5
#     become_method: ""            # 默认不提权；确需提权再用 sudo + 专用账号
# audit:
#   hash_chain: true               # 防篡改哈希链
#   worm_storage: true             # 一次写入存储
#   retention_days: 365            # 延长保留满足合规要求
#   export_format: json
# credential:
#   storage: local                 # 具备 Vault 基础设施时可切换 vault
#   encryption: aes256-gcm
#   key_derivation: argon2id
# executor:
#   exec_timeout: 600s
#   rate_limit:
#     per_target: 2                # 收紧限速，防止打爆目标机
#     per_channel: 20
#     global: 50
# log:
#   output: /var/log/levee/levee.log
# 另在运行时环境注入（不要写进任何文件）：
#   LEVEE_MASTER_PASSWORD=<master-password>   # 凭据主密码，不落盘
#   LEVEE_TOKEN=<api-token>                   # `levee serve` 的 Bearer token