name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci-gate:
    # 等待预算必须严格大于里面脚本的 CI_TIMEOUT_SECONDS，否则 job 先被杀，
    # 脚本那段预算永远不可能生效——原配置正是这种不可满足的组合：
    # job `timeout-minutes: 30`(=1800s) 而 CI_TIMEOUT_SECONDS: '3600'。
    #
    # 数值依据（2026-10-07 实测，不是估的）：master 一次完整绿 run 用时 58.5 分钟
    # （`8eced6eb`，07:53:58Z → 08:52:27Z），同日 #86 的 run 已跑到 ~61 分钟还在等
    # 聚合 job 排到 runner。所以 60 分钟的等待预算在今天这种池状态下本就只剩两分钟
    # 余量，再叠一层 30 分钟的 job 上限等于把发布卡在必然失败的位置。
    timeout-minutes: 100
    name: CI gate (tag commit)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: require successful CI for exact tag commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 90 分钟：< job 的 100 分钟，且覆盖实测的 ~59 分钟最慢完整 run。
          # 这条不变量由 scripts/test_release_workflow_budget.py 守住——
          # 谁改了其中一个而忘了另一个，当场变红，而不是等到切 tag 那天才发现。
          CI_TIMEOUT_SECONDS: '5400'
          CI_POLL_SECONDS: '15'
        run: python3 scripts/require_ci_release.py

  goreleaser:
    timeout-minutes: 30
    name: goreleaser
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container image for Kubernetes (Helm chart) and containerized deployments.
  # A SEPARATE job on purpose: a registry outage or buildx failure must not
  # block the binary/archive release — the run still goes red so the missing
  # image is visible, but the GitHub release stays published.
  #
  # The image is the repo Dockerfile (node -> go -> scratch assets -> alpine
  # runtime, non-root user, /healthz HEALTHCHECK). Built multi-arch via QEMU
  # and pushed to GHCR; the version args feed the same ldflags as goreleaser
  # so `levee version` inside the image reports the tag.
  #
  # Note: GHCR packages start PRIVATE — customers pull with credentials
  # (imagePullSecrets, see deploy/helm/levee/values.yaml).
  image:
    timeout-minutes: 60
    name: container image (ghcr.io)
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/levango7/levee:${{ github.ref_name }}
            ghcr.io/levango7/levee:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          labels: |
            org.opencontainers.image.source=https://github.com/Levango7/Levee
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
