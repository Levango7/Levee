name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # vet: cheap structural checks, runs first to fail fast.
  # ---------------------------------------------------------------------------
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # lint: golangci-lint with the project's .golangci.yml config.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12
          args: --timeout 5m

  # ---------------------------------------------------------------------------
  # test: race detector + coverage, uploads coverage to Codecov when
  # available. Runs on all three OSes to catch platform-specific bugs.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # -race needs cgo/gcc; it is flaky-slow on the Windows runner, so the
      # Windows leg runs without the detector (Linux/macOS keep full -race).
      - name: go test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race -cover -coverprofile=coverage.out ./...
      - name: go test (no race)
        if: matrix.os == 'windows-latest'
        run: go test -cover -coverprofile=coverage.out ./...
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t+0 >= 60.0) }' || {
            echo "::error::coverage ${total}% is below the 60% floor"; exit 1; }
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # integration: tagged integration suite + e2e rollback drills + PostgreSQL-
  # backed store/cluster tests. The stock unit-test matrix skips PG paths
  # (no DSN); this job is where cluster-mode storage actually gets executed.
  # ---------------------------------------------------------------------------
  integration:
    name: integration & e2e & postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levee
          POSTGRES_PASSWORD: levee-ci
          POSTGRES_DB: levee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEVEE_PG_TEST_DSN: postgres://levee:levee-ci@localhost:5432/levee_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go test (integration tag)
        run: go test -tags integration ./tests/integration/ -count=1 -timeout 300s
      - name: go test (e2e rollback drills)
        run: go test -tags e2e ./tests/e2e/ -count=1 -timeout 600s
      - name: go test (postgres store + distributed locks)
        run: go test ./internal/state/... ./internal/cluster/... -count=1 -timeout 600s

  # ---------------------------------------------------------------------------
  # build: cross-platform binary build matrix. Produces artifacts for
  # Linux, macOS and Windows on amd64 + arm64.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: macos-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: windows-latest
            arch: amd64
            goarch: amd64
            ext: ".exe"
          - os: windows-latest
            arch: arm64
            goarch: arm64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    needs: [vet, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o levee${{ matrix.ext }} ./cmd/levee
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levee-${{ matrix.os }}-${{ matrix.arch }}
          path: levee${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # gosec: Go source code security scanner. Checks for common vulnerabilities
  # like SQL injection, hardcoded secrets, unsafe random, etc.
  # ---------------------------------------------------------------------------
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: run gosec
        uses: securego/gosec@v2.28.0
        with:
          # G104 (unhandled errors) and G307 (defer file.Close) are noisy
          # low-signal classes here; G501/G505/G601 have no hits today but
          # guard future dependency drift. G402 is NOT excluded: TLS verify
          # skips must stay visible (the single vault opt-in carries #nosec).
          args: -exclude=G104,G307,G501,G505,G601 -exclude-dir=internal/grpc/pb -fmt=json -out=gosec-report.json ./...
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # trivy: scan the built Docker image for known CVEs in base images and
  # dependency libraries. Requires the image to be built first; we build
  # it inline here.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build docker image
        run: docker build -t levee:scan .
      - name: run trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: levee:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14
      - name: upload to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # check: composite gate job that PRs must pass before merge. Branch
  # protection rules can require this single job instead of listing every
  # leaf job.
  # ---------------------------------------------------------------------------
  check:
    name: check (all jobs passed)
    runs-on: ubuntu-latest
    needs: [vet, lint, test, integration, build, gosec, trivy]
    if: always()
    steps:
      - name: aggregate
        run: |
          echo "vet=${{ needs.vet.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "build=${{ needs.build.result }}"
          echo "gosec=${{ needs.gosec.result }}"
          echo "trivy=${{ needs.trivy.result }}"
          for job in vet lint test integration build gosec trivy; do
            if [[ "${{ needs[job].result }}" != "success" ]]; then
              echo "::error::required job '$job' did not pass"
              exit 1
            fi
          done
          echo "All required jobs passed"
