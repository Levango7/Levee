name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # vet: cheap structural checks, runs first to fail fast.
  # ---------------------------------------------------------------------------
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # lint: golangci-lint with the project's .golangci.yml config.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Keep in lockstep with the Makefile lint target's baseline version.
          # (v6 cannot parse v2.x tool versions; v7 is the action line built
          # for golangci-lint v2.)
          version: v2.13
          args: --timeout 5m

  # ---------------------------------------------------------------------------
  # frontend: type-check and build the Vue 3 web UI. The Go binary embeds the
  # committed internal/web/dist assets, so this job guards the source that
  # generates them even though the Go build itself does not run node.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (vitest + vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: unit tests
        run: npm run test
      - name: type-check + build
        run: npm run build

  # ---------------------------------------------------------------------------
  # test: race detector + coverage, uploads coverage to Codecov when
  # available. Runs on all three OSes to catch platform-specific bugs.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -race needs cgo/gcc; it is flaky-slow on the Windows runner, so the
      # Windows leg runs without the detector (Linux/macOS keep full -race).
      - name: go test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race -cover -coverprofile=coverage.out ./...
      - name: go test (no race)
        if: matrix.os == 'windows-latest'
        # The quoted flag matters: the default pwsh shell otherwise parses
        # -coverprofile=coverage.out as "-coverprofile=coverage" plus a bare
        # ".out" package argument (setup failed on a nonexistent package).
        run: go test -cover "-coverprofile=coverage.out" ./...
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        # The gate measures hand-written code only: generated protobuf bindings
        # (internal/grpc/pb, ~3.1k statements at 0%) are filtered out of the
        # profile before computing the total. Floor raised 60 -> 70 after the
        # E-workflow test round (2026-09): the CI-side baseline (no PG suites
        # counted) measures ~80%.
        run: |
          grep -v '/internal/grpc/pb/' coverage.out > coverage_scoped.out
          total=$(go tool cover -func=coverage_scoped.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "statement coverage (generated pb excluded): ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t+0 >= 70.0) }' || {
            echo "::error::coverage ${total}% is below the 70% floor"; exit 1; }
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # integration: tagged integration suite + e2e rollback drills + PostgreSQL-
  # backed store/cluster tests. The stock unit-test matrix skips PG paths
  # (no DSN); this job is where cluster-mode storage actually gets executed.
  # ---------------------------------------------------------------------------
  integration:
    name: integration & e2e & postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levee
          POSTGRES_PASSWORD: levee-ci
          POSTGRES_DB: levee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEVEE_PG_TEST_DSN: postgres://levee:levee-ci@localhost:5432/levee_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: go test (integration tag)
        run: go test -tags integration ./tests/integration/ -count=1 -timeout 300s
      - name: go test (e2e rollback drills)
        run: go test -tags e2e ./tests/e2e/ -count=1 -timeout 600s
      - name: go test (postgres store + distributed locks)
        run: go test ./internal/state/... ./internal/cluster/... -count=1 -timeout 600s

  # ---------------------------------------------------------------------------
  # proto: regenerate the Go protobuf bindings with the pinned protoc
  # toolchain and verify the checked-in generated files are byte-identical
  # to a fresh regeneration (no drift).
  # ---------------------------------------------------------------------------
  proto:
    name: proto regenerate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: install pinned protoc toolchain
        run: |
          set -e
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v27.0/protoc-27.0-linux-x86_64.zip
          unzip -oq /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: regenerate bindings
        run: bash scripts/gen-proto.sh
      - name: drift check (checked-in files must match regeneration)
        run: git diff --exit-code -- internal/grpc/pb/
      - name: build sanity
        run: go build ./...

  # ---------------------------------------------------------------------------
  # build: cross-platform binary build matrix. Produces artifacts for
  # Linux, macOS and Windows on amd64 + arm64.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: macos-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: windows-latest
            arch: amd64
            goarch: amd64
            ext: ".exe"
          - os: windows-latest
            arch: arm64
            goarch: arm64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    needs: [vet, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: go build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o levee${{ matrix.ext }} ./cmd/levee
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: levee-${{ matrix.os }}-${{ matrix.arch }}
          path: levee${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # gosec: Go source code security scanner. Checks for common vulnerabilities
  # like SQL injection, hardcoded secrets, unsafe random, etc.
  # ---------------------------------------------------------------------------
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: run gosec
        uses: securego/gosec@v2.28.0
        with:
          # G104 (unhandled errors) and G307 (defer file.Close) are noisy
          # low-signal classes here; G501/G505/G601 have no hits today but
          # guard future dependency drift. G402 is NOT excluded: TLS verify
          # skips must stay visible (the single vault opt-in carries #nosec).
          # G304 (file inclusion via variable): loading user/CLI-specified
          # configs, templates, plugins and baselines is the product's shape
          # — every hit is a legitimate loader; path-escape hardening is
          # enforced where it matters (e.g. drift syncJSONDir rejects
          # separator-bearing names). G115 (integer overflow conversion):
          # hits are protobuf pagination/count casts (int<->int32 on bounded
          # page values). Both classes carry 2026-09 full-triage evidence:
          # all remaining findings are fixed (0o750/0o600 tightening) or
          # individually annotated with justified #nosec reasons.
          args: -exclude=G104,G115,G304,G307,G501,G505,G601 -exclude-dir=internal/grpc/pb -fmt=json -out=gosec-report.json ./...
      - name: upload report
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # trivy: scan the built Docker image for known CVEs in base images and
  # dependency libraries. Requires the image to be built first; we build
  # it inline here.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    # security-events: write — upload-sarif; without it the upload fails with
    # "Resource not accessible by integration" once the sarif steps actually
    # run (default repo token is read-only).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: build docker image
        run: docker build -t levee:scan .
      # Visibility pass first: SARIF output silences stdout, so without this
      # a failing run has no finding list anywhere in the job log.
      # exit-code 0: this step never gates, it only prints the table.
      - name: scan (print findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: levee:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
      # NOTE: trivy-action forces an ALL-severity scan when format is sarif
      # (its own log line: "Building SARIF report with all severities"), so
      # exit-code: 1 here would block merge on every fixable MEDIUM/LOW too —
      # not the documented gate. Gate semantics therefore live in the explicit
      # jq step below; this step only produces the report, filtered down to
      # CRITICAL/HIGH via limit-severities-for-sarif.
      - name: scan (sarif)
        # v0.30.0's composite referenced aquasecurity/setup-trivy@v0.2.2 by
        # (since-deleted) tag; v0.36.0 pins the setup action to a commit SHA.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: levee:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 0
      - name: upload report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14
      - name: upload to GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      # Gate last: a red run then still leaves the artifact and the Code
      # Scanning alert. Blocking set = exactly what the filtered sarif kept
      # (fixable CRITICAL/HIGH), independent of the action's all-severity quirk.
      - name: gate (fixable CRITICAL/HIGH block merge)
        run: |
          test -f trivy-results.sarif || { echo "::error::trivy-results.sarif missing"; exit 1; }
          total=$(jq '[.runs[]?.results[]?] | length' trivy-results.sarif)
          echo "blocking findings: ${total}"
          jq -r '.runs[]?.results[]? | .ruleId' trivy-results.sarif
          test "${total}" -eq 0

  # ---------------------------------------------------------------------------
  # check: composite gate job that PRs must pass before merge. Branch
  # protection rules can require this single job instead of listing every
  # leaf job.
  # ---------------------------------------------------------------------------
  check:
    name: check (all jobs passed)
    runs-on: ubuntu-latest
    needs: [vet, lint, frontend, test, integration, proto, build, gosec, trivy]
    if: always()
    steps:
      - name: aggregate
        run: |
          # The Actions engine interpolates every expression in this block
          # BEFORE the script reaches bash, so `needs[job].result` inside a
          # bash loop expands to "": the engine sees a literal `job`, not
          # the bash variable, and there is no such needs entry. Hand each
          # result to bash as a literal name:value pair instead and check
          # them there.
          status="vet:${{ needs.vet.result }} lint:${{ needs.lint.result }} frontend:${{ needs.frontend.result }} test:${{ needs.test.result }} integration:${{ needs.integration.result }} proto:${{ needs.proto.result }} build:${{ needs.build.result }} gosec:${{ needs.gosec.result }} trivy:${{ needs.trivy.result }}"
          rc=0
          for pair in $status; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job=$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::required job '$job' did not pass ($result)"
              rc=1
            fi
          done
          if [[ $rc -eq 0 ]]; then echo "All required jobs passed"; fi
          exit $rc
