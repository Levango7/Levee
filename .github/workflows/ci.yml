name: CI

on:
  push:
    branches: [main, master, develop]
    # A release tag must create a CI run for the exact tagged commit. The
    # release workflow waits for this run's aggregate check before packaging.
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege for the whole workflow. Individual jobs that need more
# (trivy uploads SARIF) widen this at the job level. Without a top-level block
# the workflow inherits the repository default, which is usually read/write on
# all scopes — so a compromised third-party action step would get far more than
# it needs.
permissions:
  contents: read

jobs:
  release-gate:
    name: release gate policy
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: release script self-tests
        # Discovery rather than a hard-coded file list: a suite added later is
        # picked up without anyone remembering to edit this step. An empty
        # discovery would still exit 0, so each expected suite must show up in
        # the verbose log.
        #
        # `set -o pipefail` is load-bearing, not decoration. The runner's default
        # shell is `bash -e {0}` WITHOUT pipefail, so `unittest … | tee` reports
        # tee's status and a FAILED suite still exits 0 — the name grep below
        # would pass and this job would go green on a red suite. Measured
        # 2026-10-09, after a structurally broken CHANGELOG passed this gate:
        # `bash -e -c '… | tee'` → exit 0 with PIPESTATUS `unittest=1 tee=0`;
        # the same command with pipefail → exit 1. Both judgments are recorded
        # and reported together, so `-e` cannot cut the step off at the first
        # failure and hide the other verdict. scripts/test_release_gate_step.py
        # pins this shape (including that the pipe and the name list are still
        # there, so the guard cannot rot into a vacuous check).
        run: |
          set -o pipefail
          failures=""
          python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee /tmp/py.log \
            || failures="unittest"
          for suite in test_require_ci_release test_check_release_versions test_ci_aggregate test_release_workflow_budget test_changelog_structure test_release_gate_step; do
            grep -q "$suite" /tmp/py.log \
              || { echo "::error::discovery collected nothing for $suite (renamed or deleted?)"; failures="$failures missing:$suite"; }
          done
          [ -z "$failures" ] || { echo "::error::release-gate self-tests failed: $failures"; exit 1; }

  # ---------------------------------------------------------------------------
  # vet: cheap structural checks, runs first to fail fast.
  # ---------------------------------------------------------------------------
  vet:
    name: vet
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: go vet
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # lint: golangci-lint with the project's .golangci.yml config.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7
        with:
          # Keep in lockstep with the Makefile lint target's baseline version.
          # (v6 cannot parse v2.x tool versions; v7 is the action line built
          # for golangci-lint v2.)
          version: v2.13
          args: --timeout 5m

  # ---------------------------------------------------------------------------
  # frontend: type-check and build the Vue 3 web UI, then require the committed
  # internal/web/dist assets (embedded into the Go binary) to be byte-fresh
  # against this exact source — same gate shape as the proto/docs regenerate
  # checks.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (vitest + vue-tsc + vite build)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: unit tests
        run: npm run test
      - name: type-check + build
        run: npm run build
      # The Go binary embeds the COMMITTED internal/web/dist, so a stale copy
      # ships whatever the UI looked like at the last manual `make web` —
      # found out the hard way: 19 of 34 committed assets no longer matched a
      # fresh build of the same source. Rebuild the copy here and require the
      # working tree to stay clean; a diff means "run make web and commit".
      # Same gate shape as the proto/docs regenerate checks.
      - name: verify committed dist is fresh
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          find internal/web/dist -mindepth 1 ! -name '.gitignore' -exec rm -rf {} +
          cp -r web/dist/. internal/web/dist/
          if ! git diff --exit-code -- internal/web/dist; then
            echo "::error::internal/web/dist is stale against web/ — run 'make web' and commit the refreshed assets"
            exit 1
          fi
          stale=$(git ls-files --others --exclude-standard -- internal/web/dist)
          if [ -n "$stale" ]; then
            echo "::error::internal/web/dist is missing committed files the fresh build produces (stale commit):"
            echo "$stale"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # test: race detector + coverage, uploads coverage to Codecov when
  # available. Runs on all three OSes to catch platform-specific bugs.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      # -race needs cgo/gcc; it is flaky-slow on the Windows runner, so the
      # Windows leg runs without the detector (Linux/macOS keep full -race).
      - name: go test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race -cover -coverprofile=coverage.out ./...
      - name: go test (no race)
        if: matrix.os == 'windows-latest'
        # The quoted flag matters: the default pwsh shell otherwise parses
        # -coverprofile=coverage.out as "-coverprofile=coverage" plus a bare
        # ".out" package argument (setup failed on a nonexistent package).
        run: go test -cover "-coverprofile=coverage.out" ./...
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        # The gate measures hand-written code only: generated protobuf bindings
        # (internal/grpc/pb, ~3.1k statements at 0%) are filtered out of the
        # profile before computing the total. Floor raised 60 -> 70 after the
        # E-workflow test round (2026-09): the CI-side baseline (no PG suites
        # counted) measures ~80%.
        run: |
          grep -v '/internal/grpc/pb/' coverage.out > coverage_scoped.out
          total=$(go tool cover -func=coverage_scoped.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "statement coverage (generated pb excluded): ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t+0 >= 70.0) }' || {
            echo "::error::coverage ${total}% is below the 70% floor"; exit 1; }
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      # Benchmark smoke: every benchmark executes exactly once (no PG DSN
      # here, so PG-backed ones skip like they do in the unit matrix). 121
      # benchmarks existed with zero CI runs and a report pinned at v1.3.0 —
      # a rotting benchmark (compile drift, a regression to a panic) failed
      # nothing. `-run ^$` skips tests; `-benchtime=1x` bounds the run so it
      # stays a liveness gate, not a measurement (numbers are a local job).
      - name: benchmark smoke (each benchmark runs once)
        if: matrix.os == 'ubuntu-latest'
        run: go test -bench=. -benchtime=1x -run '^$' ./... -timeout 300s

  # ---------------------------------------------------------------------------
  # integration: tagged integration suite + e2e rollback drills + PostgreSQL-
  # backed store/cluster tests. The stock unit-test matrix skips PG paths
  # (no DSN); this job is where cluster-mode storage actually gets executed.
  # ---------------------------------------------------------------------------
  integration:
    name: integration & e2e & postgres
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levee
          POSTGRES_PASSWORD: levee-ci
          POSTGRES_DB: levee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEVEE_PG_TEST_DSN: postgres://levee:levee-ci@localhost:5432/levee_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      # Every step here runs under -race. The unit matrix already races the
      # default build, but on a machine without LEVEE_PG_TEST_DSN the whole
      # PostgreSQL half skips — so state/cluster/takeover/dispatch (the
      # lease-fencing, takeover and distributed-lock layer, i.e. exactly the
      # code where a data race would corrupt production state) were never
      # race-detected anywhere, while Makefile:30 prescribes -race for the
      # suite. Measured on Linux against postgres:16-alpine: all six steps
      # green, 0 "DATA RACE" reports, worst package 36.1s (state) against a
      # 600s budget.
      - name: go test (integration tag)
        run: go test -race -tags integration ./tests/integration/ -count=1 -timeout 300s
      - name: go test (e2e rollback drills)
        run: go test -race -tags e2e ./tests/e2e/ -count=1 -timeout 600s
      # state, cluster and takeover share the single CI postgres database.
      # Keep each package binary in its own step: a combined `go test` runs
      # package binaries in parallel, and state's TRUNCATE ... CASCADE would
      # otherwise wipe cluster/takeover rows (or hit the trace WORM trigger)
      # while those tests are in flight.
      - name: go test (postgres state store, isolated step)
        run: go test -race ./internal/state/... -count=1 -timeout 600s
      - name: go test (distributed locks/cluster, isolated step)
        run: go test -race ./internal/cluster/... -count=1 -timeout 600s
      - name: go test (takeover, isolated step)
        run: go test -race ./internal/takeover/... -count=1 -timeout 300s
      # Change-calendar dialect tests and the CLI's PostgreSQL store selection.
      # Both ship live tests that skip without LEVEE_PG_TEST_DSN, so without a
      # step here "verified against a real server" would never be re-checked and
      # could rot silently — the calendar package had no step at all until this.
      # Each runs inside a generated private schema with a pinned search_path, so
      # neither touches the rows the state/cluster/takeover steps share.
      - name: go test (change calendar on postgres, isolated step)
        run: go test -race ./internal/calendar/... -count=1 -timeout 300s
      - name: go test (CLI postgres store selection, isolated step)
        run: go test -race ./cmd/levee/ -run TestPostgresConfigRoundTrips -count=1 -timeout 300s
      # Backup restore drill (D-3): the drill creates/restores/drops its OWN
      # scratch databases, so it never touches the shared levee_test database;
      # kept as a separate step anyway so a drill failure is attributable.
      - name: go test (postgres backup restore drill)
        run: go test -race ./internal/backup/... -count=1 -timeout 600s

  # ---------------------------------------------------------------------------
  # proto: regenerate the Go protobuf bindings with the pinned protoc
  # toolchain and verify the checked-in generated files are byte-identical
  # to a fresh regeneration (no drift).
  # ---------------------------------------------------------------------------
  proto:
    name: proto regenerate check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: install pinned protoc toolchain
        run: |
          set -e
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v27.0/protoc-27.0-linux-x86_64.zip
          unzip -oq /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: regenerate bindings
        run: bash scripts/gen-proto.sh
      - name: drift check (checked-in files must match regeneration)
        run: git diff --exit-code -- internal/grpc/pb/
      - name: build sanity
        run: go build ./...

  # ---------------------------------------------------------------------------
  # docs: regenerate the reference tables in docs/leveelang-spec.md from the Go
  # packages that own each vocabulary, and verify the checked-in document is
  # byte-identical to a fresh generation (no drift).
  #
  # Hand-maintained vocabulary tables rot silently — the approval-level table
  # shipped three columns that disagreed with the code (a 15min timeout that is
  # really 30min, and two tiers that "reject on timeout" when one notifies and
  # one escalates), and the batch-strategy table listed three strategies the plan
  # generator never implemented. Generating from code removes the copy.
  # ---------------------------------------------------------------------------
  docs:
    name: docs regenerate check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: regenerate spec tables
        run: go run ./internal/docgen -root .
      - name: drift check (checked-in spec must match regeneration)
        run: git diff --exit-code -- docs/leveelang-spec.md
      - name: verify the check mode agrees
        run: go run ./internal/docgen -check -root .

  # ---------------------------------------------------------------------------
  # build: cross-platform binary build matrix. Produces artifacts for
  # Linux, macOS and Windows on amd64 + arm64.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: macos-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: windows-latest
            arch: amd64
            goarch: amd64
            ext: ".exe"
          - os: windows-latest
            arch: arm64
            goarch: arm64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    needs: [vet, lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: go build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o levee${{ matrix.ext }} ./cmd/levee
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: levee-${{ matrix.os }}-${{ matrix.arch }}
          path: levee${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # gosec: Go source code security scanner. Checks for common vulnerabilities
  # like SQL injection, hardcoded secrets, unsafe random, etc.
  # ---------------------------------------------------------------------------
  gosec:
    name: gosec
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      # gosec runs as a pinned-version Go program on the runner, not as the
      # project's docker action. The docker image bundles the Go toolchain
      # from its build day (golang:${GO_VERSION}-alpine at release time), so
      # a go.mod whose `go` directive outgrows it (this PR: 1.26.0 → 1.26.6)
      # sends go/packages' `go list` into a toolchain switch the container
      # does not survive — observed as a silent kill mid-scan, twice, while
      # `go run` of the same scanner version against the same tree completes
      # with 0 issues. Here the scanner version stays pinned below while the
      # toolchain floats with go-version above, exactly like govulncheck.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: run gosec
        # G104 (unhandled errors) and G307 (defer file.Close) are noisy
        # low-signal classes here; G501/G505/G601 have no hits today but
        # guard future dependency drift. G402 is NOT excluded: TLS verify
        # skips must stay visible (the single vault opt-in carries #nosec).
        # G304 (file inclusion via variable): loading user/CLI-specified
        # configs, templates, plugins and baselines is the product's shape
        # — every hit is a legitimate loader; path-escape hardening is
        # enforced where it matters (e.g. drift syncJSONDir rejects
        # separator-bearing names). G115 (integer overflow conversion):
        # hits are protobuf pagination/count casts (int<->int32 on bounded
        # page values). Both classes carry 2026-09 full-triage evidence:
        # all remaining findings are fixed (0o750/0o600 tightening) or
        # individually annotated with justified #nosec reasons.
        run: $(go env GOPATH)/bin/gosec -exclude=G104,G115,G304,G307,G501,G505,G601 -exclude-dir=internal/grpc/pb -fmt=json -out=gosec-report.json ./...
      - name: upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # govulncheck: known-vulnerability scan of the Go module graph.
  #
  # This is the gap gosec and trivy cannot cover. gosec analyses OUR source
  # for unsafe patterns; trivy scans the built image's OS packages. Neither
  # looks at the 70+ module dependencies or asks whether a function we call
  # is a known-vulnerable one — which is the vulnerability class that actually
  # caused the Go ecosystem's worst incidents. There was no scanner of any kind
  # covering this before.
  #
  # go-version-file is used rather than a pinned version so this job can never
  # silently test a different toolchain than the one go.mod declares.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The version is not pinned to a tag because the Go toolchain installs
      # govulncheck itself (`go install`), so pinning here would be a second
      # place to forget to bump. Installing @latest keeps the scanner current
      # against the live vulnerability database, which is the whole point.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # -scan=sym gives reachability analysis: it reports only vulns reachable
      # from our symbols, so a vuln in an unused code path of a dependency does
      # not fail the build. This is what keeps the gate actionable.
      #
      # The exit code is govulncheck's: 3 means "vulnerabilities found". Both
      # 0 and 3 are handled explicitly so a scanner crash (1/2) is never
      # mistaken for a pass.
      - name: scan (symbol-level)
        run: |
          set +e
          govulncheck -show verbose ./...
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::notice::govulncheck: no reachable vulnerabilities"
          elif [ "$code" -eq 3 ]; then
            echo "::error::govulncheck: reachable vulnerabilities found (see scan output above)"
            exit 1
          else
            echo "::error::govulncheck failed to run (exit $code) — treating as a scan failure, not a pass"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # trivy: scan the built Docker image for known CVEs in base images and
  # dependency libraries. Requires the image to be built first; we build
  # it inline here. NOTE: the Dockerfile MUST run `apk upgrade --no-cache` in
  # BOTH the builder and runtime stages — the golang:<ver>-alpine alias is a
  # point-in-time snapshot, and a base-package CVE (e.g. CVE-2026-84445,
  # previously CVE-2026-14456 openssl) published between releases will
  # otherwise land in the scanned image and gate the merge.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # security-events: write — upload-sarif; without it the upload fails with
    # "Resource not accessible by integration" once the sarif steps actually
    # run (default repo token is read-only).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: build docker image
        run: docker build -t levee:scan .
      # Visibility pass first: SARIF output silences stdout, so without this
      # a failing run has no finding list anywhere in the job log.
      # exit-code 0: this step never gates, it only prints the table.
      - name: scan (print findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: levee:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
      # NOTE: trivy-action forces an ALL-severity scan when format is sarif
      # (its own log line: "Building SARIF report with all severities"), so
      # exit-code: 1 here would block merge on every fixable MEDIUM/LOW too —
      # not the documented gate. Gate semantics therefore live in the explicit
      # jq step below; this step only produces the report, filtered down to
      # CRITICAL/HIGH via limit-severities-for-sarif.
      - name: scan (sarif)
        # v0.30.0's composite referenced aquasecurity/setup-trivy@v0.2.2 by
        # (since-deleted) tag; v0.36.0 pins the setup action to a commit SHA.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: levee:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 0
      - name: upload report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14
      - name: upload to GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy-results.sarif
      # Gate last: a red run then still leaves the artifact and the Code
      # Scanning alert. Blocking set = exactly what the filtered sarif kept
      # (fixable CRITICAL/HIGH), independent of the action's all-severity quirk.
      - name: gate (fixable CRITICAL/HIGH block merge)
        run: |
          test -f trivy-results.sarif || { echo "::error::trivy-results.sarif missing"; exit 1; }
          total=$(jq '[.runs[]?.results[]?] | length' trivy-results.sarif)
          echo "blocking findings: ${total}"
          jq -r '.runs[]?.results[]? | .ruleId' trivy-results.sarif
          test "${total}" -eq 0

  # ---------------------------------------------------------------------------
  # smoke: start the real binary the way the README tells operators to, and
  # keep it alive past every background interval. Package tests verify
  # packages; this is the only job that assembles the single-node daemon, so
  # it is what catches entry-point assembly bugs (a nil ClusterManager reached
  # by `serve --engine-enabled` without --cluster panicked ~10s after startup
  # and no per-package test could see it).
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (serve entry point)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true  # newest 1.26.x, not the runner's cached patch
          cache: true
      - name: build the release-shaped binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o levee ./cmd/levee
      - name: serve must come up and stay up
        run: bash scripts/smoke_serve.sh ./levee

  # ---------------------------------------------------------------------------
  # delivery: render and lint the shipped deployment artifacts.
  #
  # The Helm chart and the systemd unit are release artifacts users install, and
  # before this job nothing in CI had ever run helm against them. That is how a
  # chart passing `--cluster-dispatch-worker-capacity` — a flag the binary does
  # not define — reached users: every `helm install` produced pods in
  # CrashLoopBackOff, and the only symptom was in a pod log nobody read.
  #
  # The cobra-tree comparison lives in Go (cmd/levee/cli_reference_flags_test.go
  # scans the chart templates and the unit against the real command tree), so
  # this job adds what a text scan cannot: template syntax errors, `.Values`
  # paths that no longer exist, lint failures, and the helm signature for an
  # unresolvable key reaching a container arg list as the literal "<no value>".
  #
  # helm is pinned by checksum rather than "latest" so a runner-side upgrade
  # cannot turn this gate red (or green) on its own.
  # ---------------------------------------------------------------------------
  delivery:
    name: delivery (helm lint + render + package)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 + fetch-tags: the release-version checker reads `git tag`
      # to prove the image tag the chart deploys was actually released. A
      # partial clone without tags would hand it an empty set, so the checkout
      # must fetch them — and the checker fails loudly if they are still missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: install helm
        env:
          HELM_VERSION: v3.18.4
          HELM_SHA256: f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: validate delivery artifacts
        run: bash scripts/validate_delivery.sh

  # ---------------------------------------------------------------------------
  # check: composite gate job that PRs must pass before merge. Branch
  # protection rules can require this single job instead of listing every
  # leaf job.
  # ---------------------------------------------------------------------------
  check:
    name: check (all jobs passed)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [release-gate, vet, lint, frontend, test, integration, proto, docs, smoke, delivery, build, gosec, govulncheck, trivy]
    if: always()
    steps:
      - name: aggregate
        run: |
          # The Actions engine interpolates every expression in this block
          # BEFORE the script reaches bash, so `needs[job].result` inside a
          # bash loop expands to "": the engine sees a literal `job`, not
          # the bash variable, and there is no such needs entry. Hand each
          # result to bash as a literal name:value pair instead and check
          # them there.
          status="release-gate:${{ needs.release-gate.result }} vet:${{ needs.vet.result }} lint:${{ needs.lint.result }} frontend:${{ needs.frontend.result }} test:${{ needs.test.result }} integration:${{ needs.integration.result }} proto:${{ needs.proto.result }} docs:${{ needs.docs.result }} smoke:${{ needs.smoke.result }} delivery:${{ needs.delivery.result }} build:${{ needs.build.result }} gosec:${{ needs.gosec.result }} govulncheck:${{ needs.govulncheck.result }} trivy:${{ needs.trivy.result }}"
          # Drift guard: hand-enumerating the pairs above is required by the
          # interpolation semantics, and it rots — `docs` sat in needs() but not
          # in this list, so a docs-regeneration failure could never redden the
          # aggregate. Compare the two lists instead of trusting discipline.
          expected=$(echo '${{ toJSON(needs) }}' | jq -r 'keys[]' | tr -d '\r' | sort | tr '\n' ' ')
          listed=$(for pair in $status; do echo "${pair%%:*}"; done | tr -d '\r' | sort | tr '\n' ' ')
          if [ "$expected" != "$listed" ]; then
            echo "::error::the aggregate list drifted from needs(): needs=[$expected] checked=[$listed]"
            exit 1
          fi
          rc=0
          unverified=""
          for pair in $status; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job=$result"
            case "$result" in
              success) ;;
              # A job that never got a runner reports cancelled / skipped / neutral /
              # timed_out. That is NOT a code verdict: on a starved runner pool the
              # whole run can expire in-queue (measured 2026-10-06: four jobs, each
              # killed exactly 901s after being queued, steps=0 — none ever started).
              # Saying "did not pass" sent a reader to look for a regression; say
              # which of the two situations this is, and still refuse to be green.
              cancelled|skipped|neutral|timed_out|stale)
                echo "::error::required job '$job' produced no verdict ($result) — UNVERIFIED, not failed. Re-run this workflow before reading it as a regression."
                unverified="$unverified $job"
                rc=1
                ;;
              *)
                echo "::error::required job '$job' FAILED ($result)"
                rc=1
                ;;
            esac
          done
          if [[ $rc -eq 0 ]]; then
            echo "All required jobs passed"
          elif [ -n "$unverified" ]; then
            # Distinguish the two failure modes in the summary line too, so a queued
            # re-run is the obvious next action instead of a bisect.
            echo "Aggregate result: NOT GREEN — jobs with no verdict:$unverified"
          else
            echo "Aggregate result: NOT GREEN — at least one required job failed"
          fi
          exit $rc
