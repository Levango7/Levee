name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # vet: cheap structural checks, runs first to fail fast.
  # ---------------------------------------------------------------------------
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # lint: golangci-lint with the project's .golangci.yml config.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout 5m

  # ---------------------------------------------------------------------------
  # test: race detector + coverage, uploads coverage to Codecov when
  # available. Runs on all three OSes to catch platform-specific bugs.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go test
        run: go test -race -cover -coverprofile=coverage.out ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # build: cross-platform binary build matrix. Produces artifacts for
  # Linux, macOS and Windows on amd64 + arm64.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: macos-latest
            arch: amd64
            goarch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            goarch: arm64
            ext: ""
          - os: windows-latest
            arch: amd64
            goarch: amd64
            ext: ".exe"
          - os: windows-latest
            arch: arm64
            goarch: arm64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    needs: [vet, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o levee${{ matrix.ext }} ./cmd/levee
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levee-${{ matrix.os }}-${{ matrix.arch }}
          path: levee${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # check: composite gate job that PRs must pass before merge. Branch
  # protection rules can require this single job instead of listing every
  # leaf job.
  # ---------------------------------------------------------------------------
  check:
    name: check (all jobs passed)
    runs-on: ubuntu-latest
    needs: [vet, lint, test, build]
    if: always()
    steps:
      - name: aggregate
        run: |
          echo "vet=${{ needs.vet.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          if [[ "${{ needs.vet.result }}" != "success" || \
                "${{ needs.lint.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
