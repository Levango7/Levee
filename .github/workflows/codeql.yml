name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual escape hatch, same rationale as ci.yml's: this repo has recurring
  # episodes where GitHub silently drops push/pull_request events (no run rows
  # at all — #140/#141/#177-#179); with dispatch, recovery is one command:
  #   gh workflow run codeql.yml --ref <branch>
  workflow_dispatch:
  # Weekly scheduled scan of the default branch, Mondays 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # analyze: CodeQL semantic code analysis for the Go codebase. Detects
  # security-relevant data flows (injection, taint tracking, path queries)
  # beyond what gosec's AST checks catch. Results surface in the repository
  # Security tab (Code Scanning). Runs on every push/PR plus the weekly
  # scheduled scan.
  # ---------------------------------------------------------------------------
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Setup Go explicitly so autobuild runs against the pinned toolchain
      # used by the CI job matrix, not the runner's default version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod  # the toolchain the module declares: setup-go's alias resolution is stale
          cache: true
      - name: initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
      # autobuild compiles the Go module the same way `go build` would;
      # CodeQL needs a compiled database to run its queries against.
      - name: autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      - name: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          # Tag results per language so multi-language matrices later do not
          # overwrite each other in Code Scanning.
          category: "/language:${{ matrix.language }}"