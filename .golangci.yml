version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocyclo
    - bodyclose
    - unparam
  settings:
    gocyclo:
      # golangci-lint upstream default is 30; the next section of this file
      # documents that config.go Validate (>30) is refactored separately.
      min-complexity: 30
    misspell:
      # The codebase is consistently written in British English
      # (cancelled/behaviour/catalogue/...) — including the workflow status
      # literal "cancelled" persisted in the state store and emitted in CLI
      # JSON. locale: UK keeps those intact.
      locale: UK
      # Established vocabulary — these are Oxford-style (-ize) and project
      # terms used in identifiers that must stay API-stable, not typos:
      # "context canceled" is stdlib error text; tests must keep matching it.
      ignore-words:
        - canceled
        - analyze
        - analyzed
        - analyzes
        - artifact
        - artifacts
        - center
        - color
        - dialing
        - distills
        - initialized
        - legalizing
        - normalize
        - normalized
        - optimize
        - optimized
        - optimizing
        - sanitize
        - serialization
        - serialize
        - stabilized
        - summarizes
        - synchronization
        - unauthorized
        - utilization
    errcheck:
      # Writing to stdout/stderr in CLI code: a failed print must not abort
      # command output. This is the standard errcheck configuration for CLI
      # tools.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - unparam
      # revive style rules that are pure noise for this codebase:
      # cobra RunE handlers keep required-but-unused cmd/args params, and
      # doc-comment coverage is enforced by review, not by the linter.
      - linters:
          - revive
        text: "^(unused-parameter|exported|package-comments):"
      # Tests deliberately pass nil contexts to exercise the nil-tolerance
      # behaviour of the APIs under test; SA1012 is a false positive there.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA1012:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/nexus/levee
  exclusions:
    generated: lax
    paths:
      - internal/grpc/pb

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
