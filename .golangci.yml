version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell  # enabled. NOTE: the codebase mixes UK spelling in comments/strings
                # with US spelling in API identifiers; CI passes today, but when a
                # specific file regresses, run `misspell -locale UK` or `-locale US`
                # manually to isolate the variant that flagged it.
    - revive
    - gocyclo
    - bodyclose
    - unparam
  settings:
    gocyclo:
      # golangci-lint upstream default is 30; the next section of this file
      # documents that config.go Validate (>30) is refactored separately.
      min-complexity: 30
    errcheck:
      # Writing to stdout/stderr in CLI code: a failed print must not abort
      # command output. This is the standard errcheck configuration for CLI
      # tools.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - unparam
      # revive style rules that are pure noise for this codebase:
      # cobra RunE handlers keep required-but-unused cmd/args params, and
      # doc-comment coverage is enforced by review, not by the linter.
      - linters:
          - revive
        text: "^(unused-parameter|exported|package-comments):"
      # Tests deliberately pass nil contexts to exercise the nil-tolerance
      # behaviour of the APIs under test; SA1012 is a false positive there.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA1012:"
      # revive rules with legitimate false positives:
      # - redefines-builtin-id: local vars named cap/max/min/copy are idiomatic
      #   in Go 1.21+ (shadowing stdlib builtins is safe here).
      # - empty-block: empty else/switch-default blocks are intentional markers.
      # - context-as-argument: test helpers sometimes break the convention.
      # - context-keys-type: test code uses string keys for readability.
      - linters:
          - revive
        text: "^(redefines-builtin-id|empty-block|context-as-argument|context-keys-type):"
      # staticcheck QF1001/QF1012/S1011 in files already fixed in Phase 2:
      # keep these excluded until a broader refactor lands.
      - path: internal/recommend/knowledge_base\.go
        linters:
          - staticcheck
        text: "S1011:"
      - path: internal/compat/compat\.go
        linters:
          - staticcheck
        text: "QF1001:"
      - path: internal/chatops/card\.go
        linters:
          - staticcheck
        text: "QF1012:"
      # unparam: functions where the error/bool result is documented as always
      # nil/true (convention over enforcement); fixing requires signature churn.
      - linters:
          - unparam
        text: "result 1 \\(error\\) is always nil"
      - linters:
          - unparam
        text: "result 1 \\(bool\\) is never used"
      - linters:
          - unparam
        text: "Changed always receives true"
      - linters:
          - unparam
        text: "line always receives 0"
      # unused: test-only helpers and intentionally kept shim types.
      - path: _test\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nexus/levee
  exclusions:
    generated: lax
    paths:
      - internal/grpc/pb

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
